name: XGBA R42 native two-source in-game dialogue, item rewards and genuine Flash
on:
  push:
    branches: [main, 'phase3/r42-native-in-game-multisource-events-20261113']
    paths:
      - 'tools/xgba_r42_event_assets.py'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tools/xgba_mgba_run.py'
      - 'integration/emerald/xgba_r42_two_source_events.inc'
      - 'integration/emerald/xgba_r17_external_littleroot.inc'
      - 'integration/emerald/xgba_r18_save.inc'
      - 'integration/mgba/xgba_r18_emerald_flash.h'
      - 'tests/test_xgba_r42_native_two_source_gameplay.py'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - '.github/workflows/xgba-r42-two-source-gameplay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/xgba_r42_event_assets.py'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tools/xgba_mgba_run.py'
      - 'integration/emerald/xgba_r42_two_source_events.inc'
      - 'integration/emerald/xgba_r17_external_littleroot.inc'
      - 'integration/emerald/xgba_r18_save.inc'
      - 'integration/mgba/xgba_r18_emerald_flash.h'
      - 'tests/test_xgba_r42_native_two_source_gameplay.py'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - '.github/workflows/xgba-r42-two-source-gameplay.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgba-r42-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-authored-original-emerald-events:
    name: Source-authored event encoding, source ID separation and original game opcode layouts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check event opcode layouts and resource independence
        run: |
          set -euo pipefail
          python3 -m py_compile tools/xgba_r42_event_assets.py tests/test_xgba_r42_native_two_source_gameplay.py
          PYTHONPATH=tools:tests:integration/mgba python3 -m unittest test_xgba_r42_native_two_source_gameplay.TwoSourceAuthoredEventContracts -v 2>&1 | tee /tmp/r42-encoding.log
          grep -q 'Ran 4 tests' /tmp/r42-encoding.log
          grep -q '^OK$' /tmp/r42-encoding.log
          echo PASS_R42_TWO_EXTERNAL_EVENT_ASSET_SOURCE_CONTRACTS
  native-original-emerald-script-ui-bag-flash:
    name: Actual original Emerald R/L dialog + Nugget/Silk Scarf + Flash cold restart + five LCD frames
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned original native ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@49f4db4520f840e77ab1e99b24cfac2c540a21b1
        with:
          release: '13.2.Rel1'
      - name: Resolve original PNG capture dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash tools/xgba_ci_png_prereqs.sh
          if ! python3 -c 'from PIL import Image' >/dev/null 2>&1; then
            python3 -m pip install --user --break-system-packages --disable-pip-version-check 'Pillow==11.3.0'
          fi
      - name: Fetch immutable original Emerald and native mGBA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          git clone --quiet --filter=blob:none https://github.com/pret/pokeemerald.git upstream/pokeemerald
          git -C upstream/pokeemerald checkout --quiet --detach 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          git clone --quiet --filter=blob:none https://github.com/mgba-emu/mgba.git upstream/mgba
          git -C upstream/mgba checkout --quiet --detach fd9dc5c2cbf234365068855851107e762fc6211b
          test "$(git -C upstream/pokeemerald rev-parse HEAD)" = 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          test "$(git -C upstream/mgba rev-parse HEAD)" = fd9dc5c2cbf234365068855851107e762fc6211b
      - name: Execute gameplay and publish proof without any ROM or save
        shell: bash
        env:
          XGBA_R42_EVIDENCE_DIR: ${{ github.workspace }}/r42-evidence
        run: |
          set -euo pipefail
          PYTHONPATH=tools:tests:integration/mgba python3 -m unittest test_xgba_r42_native_two_source_gameplay.NativeEmeraldTwoSourceGameplay -v 2>&1 | tee r42-native.log
          grep -q 'Ran 6 tests' r42-native.log
          grep -q '^OK$' r42-native.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path("r42-evidence")
          d=json.loads((p/"proof.json").read_text())
          assert d["genuine_message_ui"] and d["genuine_original_bag_nugget_and_silk_scarf"]
          assert d["original_flash_cold_persistence"]
          assert not d["original_team_rocket_script_executed_unmodified"]
          assert not d["heart_soul_custom_engine_scripts_executed_unmodified"]
          assert not d["three_full_games_unified"]
          pics=sorted(p.glob("*.png"))
          assert len(pics)==5,pics
          for pic in pics:
              with Image.open(pic) as img: assert img.size==(240,160)
          assert not list(p.glob("*.gba")) and not list(p.glob("*.sav")) and not list(p.glob("*.bin"))
          print("PASS_R42_NATIVE_ORIGINAL_EMERALD_TWO_SOURCE_GAMEPLAY 6/6 screenshots=5")
          PY
      - name: Publish only original LCD frames and source-neutral JSON proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-r42-native-emerald-rocket-johto-adapted-gameplay
          path: |
            r42-evidence/*.png
            r42-evidence/proof.json
          retention-days: 90
          if-no-files-found: error
