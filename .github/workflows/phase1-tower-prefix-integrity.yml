name: Phase 1 pinned Trainer Tower partial-floor integrity boundary
on:
  pull_request:
    paths:
      - 'tools/phase1_tower_prefix_integrity.py'
      - '.github/workflows/phase1-tower-prefix-integrity.yml'
      - 'docs/PHASE1_P0_FIRERED_TOWER_PREFIX_INTEGRITY_2026-10-27.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-source-and-synthetic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence scripts at invoking SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable FireRed source
        uses: actions/checkout@v4
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: pinned-firered
          persist-credentials: false
      - name: Verify exact blobs, source anchors, negative controls and synthetic cases
        run: |
          python3 tools/phase1_tower_prefix_integrity.py \
            --source-dir pinned-firered \
            --self-test \
            --out evidence/tower-prefix-integrity.json
      - name: Retain fail-closed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-tower-prefix-integrity
          path: evidence/tower-prefix-integrity.json
          if-no-files-found: warn
