name: Phase 1 pinned FireRed layout writer census
on:
  pull_request:
    paths:
      - 'tools/phase1_firered_layout_writer_census.py'
      - 'tools/phase1_firered_tower_whiteout_boundary.py'
      - '.github/workflows/phase1-firered-layout-writers.yml'
      - 'docs/PHASE1_P0_FIRERED_LAYOUT_WRITER_CENSUS_2026-10-26.md'
      - 'docs/PHASE1_P0_FIRERED_TOWER_WHITEOUT_SAVED_INDEX_2026-10-26.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-layout-writers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout XGBA audit source
        uses: actions/checkout@v4
      - name: Checkout pinned FireRed upstream
        uses: actions/checkout@v4
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: upstream-firered
          persist-credentials: false
      - name: Compile checkers
        run: |
          python3 -m py_compile tools/phase1_firered_layout_writer_census.py
          python3 -m py_compile tools/phase1_firered_tower_whiteout_boundary.py
      - name: Run pinned authored layout-writer census
        run: |
          python3 tools/phase1_firered_layout_writer_census.py \
            --source upstream-firered \
            --output phase1-evidence/firered-layout-writers.json
      - name: Run pinned Trainer Tower whiteout index check
        run: |
          python3 tools/phase1_firered_tower_whiteout_boundary.py \
            --source upstream-firered \
            --output phase1-evidence/firered-tower-whiteout-index.json
      - name: Preserve pinned evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-firered-layout-writers
          path: phase1-evidence/
          if-no-files-found: warn
          retention-days: 30
