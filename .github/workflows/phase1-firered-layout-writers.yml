name: Phase 1 pinned FireRed layout writer census
on:
  pull_request:
    paths:
      - 'tools/phase1_firered_layout_writer_census.py'
      - 'tools/phase1_firered_tower_whiteout_boundary.py'
      - 'tools/phase1_firered_tower_local_floor_branch.py'
      - 'tools/phase1_firered_tower_opponent_index.py'
      - 'tools/phase1_firered_tower_floor_progress.py'
      - 'tools/phase1_firered_tower_temp_index_lifetime.py'
      - 'tools/phase1_firered_tower_authored_topology.py'
      - '.github/workflows/phase1-firered-layout-writers.yml'
      - 'docs/PHASE1_P0_FIRERED_LAYOUT_WRITER_CENSUS_2026-10-26.md'
      - 'docs/PHASE1_P0_FIRERED_TOWER_WHITEOUT_SAVED_INDEX_2026-10-26.md'
      - 'docs/PHASE1_P0_FIRERED_TOWER_LOCAL_FLOOR_BRANCH_2026-10-26.md'
      - 'docs/PHASE1_P0_FIRERED_TOWER_OPPONENT_INDEX_2026-10-26.md'
      - 'docs/PHASE1_P0_FIRERED_TOWER_FLOOR_PROGRESS_2026-10-26.md'
      - 'docs/PHASE1_P0_FIRERED_TOWER_TEMP_INDEX_LIFETIME_2026-10-26.md'
      - 'docs/PHASE1_P0_FIRERED_TOWER_AUTHORED_TOPOLOGY_2026-10-26.md'
      - 'docs/PHASE1_STATUS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-layout-writers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout XGBA audit source
        uses: actions/checkout@v4
      - name: Checkout pinned FireRed upstream
        uses: actions/checkout@v4
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: upstream-firered
          persist-credentials: false
      - name: Compile checkers
        run: |
          python3 -m py_compile tools/phase1_firered_layout_writer_census.py
          python3 -m py_compile tools/phase1_firered_tower_whiteout_boundary.py
          python3 -m py_compile tools/phase1_firered_tower_local_floor_branch.py
          python3 -m py_compile tools/phase1_firered_tower_opponent_index.py
          python3 -m py_compile tools/phase1_firered_tower_floor_progress.py
          python3 -m py_compile tools/phase1_firered_tower_temp_index_lifetime.py
          python3 -m py_compile tools/phase1_firered_tower_authored_topology.py
      - name: Run pinned authored layout-writer census
        run: |
          python3 tools/phase1_firered_layout_writer_census.py \
            --source upstream-firered \
            --output phase1-evidence/firered-layout-writers.json
      - name: Run pinned Trainer Tower whiteout index check
        run: |
          python3 tools/phase1_firered_tower_whiteout_boundary.py \
            --source upstream-firered \
            --output phase1-evidence/firered-tower-whiteout-index.json
      - name: Verify pinned Trainer Tower local-floor source branch
        run: |
          python3 tools/phase1_firered_tower_local_floor_branch.py \
            --source upstream-firered \
            --output phase1-evidence/firered-tower-local-floor-branch.json
      - name: Verify pinned Trainer Tower opponent index dependencies
        run: |
          python3 tools/phase1_firered_tower_opponent_index.py \
            --source upstream-firered \
            --output phase1-evidence/firered-tower-opponent-index.json
      - name: Verify pinned Trainer Tower saved floor-progress table bounds
        run: |
          python3 tools/phase1_firered_tower_floor_progress.py \
            --source upstream-firered \
            --output phase1-evidence/firered-tower-floor-progress.json
      - name: Verify pinned Trainer Tower temporary opponent index lifecycle
        run: |
          python3 tools/phase1_firered_tower_temp_index_lifetime.py \
            --source upstream-firered \
            --output phase1-evidence/firered-tower-temp-index-lifetime.json
      - name: Verify pinned Trainer Tower authored map topology and progress dispatch
        run: |
          python3 tools/phase1_firered_tower_authored_topology.py \
            --source upstream-firered \
            --output phase1-evidence/firered-tower-authored-topology.json
      - name: Preserve pinned evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-firered-layout-writers
          path: phase1-evidence/
          if-no-files-found: warn
          retention-days: 30
