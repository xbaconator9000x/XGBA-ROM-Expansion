name: Phase 1 pinned source census and review dossiers
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/pinned_source_census.py'
      - 'tools/semantic_review_dossiers.py'
      - 'tools/include_dependency_classifier.py'
      - 'tools/phase1_mapping_gate.py'
      - 'tools/verify_source_contracts.py'
      - 'tools/validate_mapping_anchors.py'
      - 'tools/ast_semantic_index.py'
      - 'tools/all_blob_structural_evidence.py'
      - 'tools/semantic_asm_build.py'
      - 'tools/unified_semantic_dependencies.py'
      - 'tools/semantic_linkage_filter.py'
      - 'tools/semantic_callback_flow.py'
      - 'tools/gba_memory_region_contracts.py'
      - 'tools/generated_asset_provenance.py'
      - 'tools/dynamic_dispatch_semantics.py'
      - 'tools/script_opcode_semantic_obligations.py'
      - 'tools/module_semantic_dossiers.py'
      - 'tools/resolve_composite_assets.py'
      - '.github/workflows/phase1-census.yml'
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python syntax
        run: |
          python3 -m py_compile tools/pinned_source_census.py tools/semantic_review_dossiers.py
          python3 tools/semantic_review_dossiers.py --self-test
      - name: Clone pinned sources and scan
        run: python3 tools/pinned_source_census.py --checkout --root upstream --out audit-output
      - name: Verify pinned Poryscript compiler parsing and emission tests
        working-directory: upstream/poryscript
        run: |
          set -o pipefail
          go test ./... | tee ../../audit-output/poryscript_go_tests.log
          go build ./...
      - name: Generate hashed review dossiers and priority queue
        run: python3 tools/semantic_review_dossiers.py --root upstream --census audit-output --out audit-output
      - name: Classify unresolved include candidates
        run: python3 tools/include_dependency_classifier.py
      - name: Verify source-anchored ABI invariants
        run: python3 tools/verify_source_contracts.py upstream
      - name: Verify all 29,068 mapping anchors against pinned source lines
        run: python3 tools/validate_mapping_anchors.py upstream imports/XGBA_Phase1_v1.5_Complete_Workpack.zip
      - name: Install pinned syntax-tree grammars
        run: |
          python3 -m pip install 'tree-sitter==0.25.2' 'tree-sitter-c==0.24.1' 'tree-sitter-cpp==0.23.4' 'tree-sitter-go==0.25.0' 'tree-sitter-python==0.25.0'
      - name: Build AST scope and candidate call graph
        run: python3 tools/ast_semantic_index.py --root upstream --census audit-output --out audit-output
      - name: Reject unbindable cross-TU static C functions and unresolved C++ name calls
        run: python3 tools/semantic_linkage_filter.py
      - name: Resolve named callback assignments to indirect member-call candidates
        run: python3 tools/semantic_callback_flow.py
      - name: Audit each GBA ROM/EEPROM/RAM decoder branch across all memory callback widths
        run: python3 tools/gba_memory_region_contracts.py
      - name: Verify every Git blob and structurally classify assets
        run: python3 tools/all_blob_structural_evidence.py
      - name: Index assembly, linker and build-file semantics
        run: python3 tools/semantic_asm_build.py
      - name: Trace FireRed generated graphics outputs to actual build inputs
        run: python3 tools/generated_asset_provenance.py
      - name: Resolve special multi-source graphics composite rules
        run: python3 tools/resolve_composite_assets.py
      - name: Resolve all FireRed field and battle opcode dispatch tables
        run: python3 tools/dynamic_dispatch_semantics.py
      - name: Audit source-backed operand and cursor semantics of all 461 script opcodes
        run: python3 tools/script_opcode_semantic_obligations.py
      - name: Reconcile source, assembler and asset dependency candidates
        run: python3 tools/unified_semantic_dependencies.py
      - name: Assemble complete per-module evidence and semantic review obligations
        run: python3 tools/module_semantic_dossiers.py
      - name: Evaluate Phase 1 semantic gate (incomplete is expected until signed review)
        run: |
          rc=0
          python3 tools/phase1_mapping_gate.py --root audit-output || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
      - name: Preserve census, review queue and 500-file checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-phase1-evidence-and-review-queue
          path: audit-output/
          retention-days: 90
          if-no-files-found: warn
