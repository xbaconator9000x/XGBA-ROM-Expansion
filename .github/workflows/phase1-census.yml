name: Phase 1 pinned source census and review dossiers
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/pinned_source_census.py'
      - 'tools/semantic_review_dossiers.py'
      - 'tools/include_dependency_classifier.py'
      - 'tools/phase1_mapping_gate.py'
      - 'tools/phase1_copilot_receipts.py'
      - 'tests/test_phase1_copilot_receipts.py'
      - 'docs/phase1-review-readiness/copilot-semantic-review-receipts.jsonl'
      - 'tools/verify_source_contracts.py'
      - 'tools/verify_p0_additive_source_contracts.py'
      - 'tools/verify_curated_p0_semantic_registry.py'
      - 'tools/phase1_architecture_review_priorities.py'
      - 'semantic-snapshots/curated/p0_semantic_review_candidates_2026-10-26.json'
      - 'docs/PHASE1_P0_FIRERED_MAP_SCRIPT_POINTER_ABI_2026-10-26.md'
      - 'docs/PHASE1_P0_PORYMAP_PORYSCRIPT_AUTHORING_ABI_2026-10-26.md'
      - 'docs/PHASE1_P0_EXTERNAL_RESOURCE_BANKING_CONTRACT_2026-10-26.md'
      - 'docs/PHASE1_P0_FIELD_SCRIPT_RETURN_STACK_LIFETIME_2026-10-26.md'
      - 'docs/PHASE1_P0_MAP_CELL_WRITE_OPERATION_SEMANTICS_2026-10-26.md'
      - 'tools/validate_mapping_anchors.py'
      - 'tools/ast_semantic_index.py'
      - 'tools/all_blob_structural_evidence.py'
      - 'tools/semantic_asm_build.py'
      - 'tools/unified_semantic_dependencies.py'
      - 'tools/semantic_linkage_filter.py'
      - 'tools/semantic_callback_flow.py'
      - 'tools/gba_memory_region_contracts.py'
      - 'tools/generated_asset_provenance.py'
      - 'tools/dynamic_dispatch_semantics.py'
      - 'tools/script_opcode_semantic_obligations.py'
      - 'tools/script_assembler_operand_abi.py'
      - 'tools/script_conditional_opcode_semantics.py'
      - 'tools/field_operand_consumer_alignment.py'
      - 'tools/battle_opcode_cursor_alignment.py'
      - 'tools/legacy_dummy_opcode_semantics.py'
      - 'tools/field_pointer_role_contracts.py'
      - 'tools/implicit_battle_cursor_semantics.py'
      - 'tools/module_semantic_dossiers.py'
      - 'tools/source_update_impact.py'
      - 'tools/resource_execution_semantics.py'
      - 'tools/graphics_hardware_semantics.py'
      - 'tools/save_sector_source_semantics.py'
      - 'tools/function_semantic_dossiers.py'
      - 'tools/resolve_composite_assets.py'
      - '.github/workflows/phase1-census.yml'
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python syntax
        run: |
          python3 -m py_compile tools/pinned_source_census.py tools/semantic_review_dossiers.py tools/phase1_copilot_receipts.py tools/phase1_mapping_gate.py
          python3 tools/semantic_review_dossiers.py --self-test
          python3 tools/phase1_mapping_gate.py --self-test
          python3 -m unittest discover -s tests -p test_phase1_copilot_receipts.py -v
      - name: Clone pinned sources and scan
        run: python3 tools/pinned_source_census.py --checkout --root upstream --out audit-output
      - name: Verify pinned Poryscript compiler parsing and emission tests
        working-directory: upstream/poryscript
        run: |
          set -o pipefail
          go test ./... | tee ../../audit-output/poryscript_go_tests.log
          go build ./...
      - name: Generate hashed review dossiers and priority queue
        run: python3 tools/semantic_review_dossiers.py --root upstream --census audit-output --out audit-output
      - name: Classify unresolved include candidates
        run: python3 tools/include_dependency_classifier.py
      - name: Verify source-anchored ABI invariants
        run: python3 tools/verify_source_contracts.py upstream
      - name: Verify all 29,068 mapping anchors against pinned source lines
        run: python3 tools/validate_mapping_anchors.py upstream imports/XGBA_Phase1_v1.5_Complete_Workpack.zip
      - name: Install pinned syntax-tree grammars
        run: |
          python3 -m pip install 'tree-sitter==0.25.2' 'tree-sitter-c==0.24.1' 'tree-sitter-cpp==0.23.4' 'tree-sitter-go==0.25.0' 'tree-sitter-python==0.25.0'
      - name: Build AST scope and candidate call graph
        run: python3 tools/ast_semantic_index.py --root upstream --census audit-output --out audit-output
      - name: Reject unbindable cross-TU static C functions and unresolved C++ name calls
        run: python3 tools/semantic_linkage_filter.py
      - name: Resolve named callback assignments to indirect member-call candidates
        run: python3 tools/semantic_callback_flow.py
      - name: Audit each GBA ROM/EEPROM/RAM decoder branch across all memory callback widths
        run: python3 tools/gba_memory_region_contracts.py
      - name: Verify every Git blob and structurally classify assets
        run: python3 tools/all_blob_structural_evidence.py
      - name: Index assembly, linker and build-file semantics
        run: python3 tools/semantic_asm_build.py
      - name: Trace FireRed generated graphics outputs to actual build inputs
        run: python3 tools/generated_asset_provenance.py
      - name: Resolve special multi-source graphics composite rules
        run: python3 tools/resolve_composite_assets.py
      - name: Resolve all FireRed field and battle opcode dispatch tables
        run: python3 tools/dynamic_dispatch_semantics.py
      - name: Audit source-backed operand and cursor semantics of all 461 script opcodes
        run: python3 tools/script_opcode_semantic_obligations.py
      - name: Verify assembler macro argument widths for field and battle scripts
        run: python3 tools/script_assembler_operand_abi.py
      - name: Resolve conditional movement/remote-object opcode variants
        run: python3 tools/script_conditional_opcode_semantics.py
      - name: Reconcile source operand widths of all 213 field script handlers
        run: python3 tools/field_operand_consumer_alignment.py
      - name: Map all battle opcode assembler widths to source cursor advance and branching
        run: python3 tools/battle_opcode_cursor_alignment.py
      - name: Prove legacy no-consume script handlers and source-literal NOP padding
        run: python3 tools/legacy_dummy_opcode_semantics.py
      - name: Verify typed ABI of field-script code, native and RAM byte pointers
        run: python3 tools/field_pointer_role_contracts.py
      - name: Verify ROM backing, M4A track pointers and animated tileset DMA lifetimes
        run: python3 tools/resource_execution_semantics.py
      - name: Verify decompression scratch, sprite/OBJ allocator and native VRAM limits
        run: python3 tools/graphics_hardware_semantics.py
      - name: Verify native flash sector IDs, slot checksums and emulator save types
        run: python3 tools/save_sector_source_semantics.py
      - name: Reconcile source, assembler and asset dependency candidates
        run: python3 tools/unified_semantic_dependencies.py
      - name: Verify eight delegated or terminal battle cursor handlers
        run: python3 tools/implicit_battle_cursor_semantics.py
      - name: Assemble complete per-module evidence and semantic review obligations
        run: python3 tools/module_semantic_dossiers.py
      - name: Validate conservative source-update impact and pinned revision identity
        run: |
          python3 tools/source_update_impact.py --self-test
          python3 tools/source_update_impact.py --baseline audit-output --root upstream --out audit-output
      - name: Index every source-anchored function's calls, writes and control flow
        run: python3 tools/function_semantic_dossiers.py
      - name: Evaluate Phase 1 semantic gate (incomplete is expected until signed review)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rc=0
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          python3 tools/phase1_mapping_gate.py --root audit-output --source-root upstream \
            --expected-head "$expected_head" --repository "$GITHUB_REPOSITORY" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
      - name: Preserve census, review queue and 500-file checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-phase1-evidence-and-review-queue
          path: audit-output/
          retention-days: 90
          if-no-files-found: warn
