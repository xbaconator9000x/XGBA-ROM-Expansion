permissions:
  contents: read
jobs:
  compile-porymap:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - name: Verify Copilot dispatcher candidate syntax and safe guards
        run: python3 tests/test_phase1_copilot_chain.py
      - name: Install pinned editor host build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev qt6-declarative-dev qt6-charts-dev libqt6svg6-dev bear make g++
          qmake6 --version
      - name: Clone source revision
        run: |
          git clone --quiet --filter=blob:none https://github.com/huderlem/porymap.git upstream/porymap
          git -C upstream/porymap fetch --quiet origin 26b919d7ff4b54152de010abd5bf344af2ebe116
          git -C upstream/porymap checkout --quiet --detach 26b919d7ff4b54152de010abd5bf344af2ebe116
          test "$(git -C upstream/porymap rev-parse HEAD)" = 26b919d7ff4b54152de010abd5bf344af2ebe116
      - name: Exercise pinned AdvanceMap importer and malformed-dimension boundary
        run: |
          python3 tools/phase1_porymap_advancemap_import.py \
            --porymap upstream/porymap \
            --output porymap-compiler-evidence/porymap-advancemap-import.json
      - name: Exercise pinned Porymap validators and declared setter link boundary
        run: |
          python3 tools/phase1_porymap_validator_native.py \
            --porymap upstream/porymap \
            --output porymap-compiler-evidence/porymap-validator-native.json
      - name: Inventory external-editor preference and compile original config writer
        run: |
          python3 tools/phase1_porymap_external_editor_boundary.py \
            --porymap upstream/porymap \
            --dossier docs/phase1-review-readiness/porymap-external-editor-preference-boundary-20261105.md \
            --output porymap-compiler-evidence/porymap-external-editor-boundary.json \
            --archive porymap-compiler-evidence/porymap-external-editor-boundary.tar.gz
      - name: Inventory pinned event-script consumer source closure
        run: |
          python3 tools/phase1_porymap_script_consumer_closure.py \
            --porymap upstream/porymap \
            --dossier docs/phase1-review-readiness/porymap-event-script-consumer-closure-20261105.md \
            --output porymap-compiler-evidence/porymap-script-consumer-source-closure.json \
            --archive porymap-compiler-evidence/porymap-script-consumer-source-closure.tar.gz
      - name: Exercise pinned external-script watcher and launch boundaries
        run: |
          python3 tools/phase1_porymap_external_script_reload.py \
            --porymap upstream/porymap \
            --dossier docs/phase1-review-readiness/porymap-external-script-reload-boundary-20261105.md \
            --output porymap-compiler-evidence/porymap-external-script-reload-boundary.json \
            --archive porymap-compiler-evidence/porymap-external-script-reload-boundary.tar.gz
      - name: Exercise pinned RegionMap save and dirty-state boundaries
        run: |
          python3 tools/phase1_porymap_regionmap_persistence.py \
            --porymap upstream/porymap \
            --harness tests/phase1_porymap_regionmap_persistence.cpp \
            --dossier docs/phase1-review-readiness/porymap-regionmap-persistence-boundary-20261105.md \
            --output porymap-compiler-evidence/porymap-regionmap-persistence.json \
            --archive porymap-compiler-evidence/porymap-regionmap-persistence.tar.gz \
            --log porymap-compiler-evidence/porymap-regionmap-persistence.log
      - name: Verify pinned RegionMap entry-to-Project caller boundary
        run: |
          python3 tools/phase1_porymap_regionmap_project_caller.py \
            --porymap upstream/porymap \
            --harness tests/phase1_porymap_regionmap_project_caller.cpp \
            --dossier docs/phase1-review-readiness/porymap-regionmap-project-caller-20261105.md \
            --output porymap-compiler-evidence/porymap-regionmap-project-caller.json \
            --archive porymap-compiler-evidence/porymap-regionmap-project-caller.tar.gz \
            --log porymap-compiler-evidence/porymap-regionmap-project-caller.log
      - name: Exercise pinned RegionMap multi-map Project save failure boundary
        run: |
          python3 tools/phase1_porymap_regionmap_project_save.py \
            --porymap upstream/porymap \
            --harness tests/phase1_porymap_regionmap_project_save.cpp \
            --dossier docs/phase1-review-readiness/porymap-regionmap-project-save-failure-closure-20261106.md \
            --output porymap-compiler-evidence/porymap-regionmap-project-save.json \
            --archive porymap-compiler-evidence/porymap-regionmap-project-save.tar.gz \
            --log porymap-compiler-evidence/porymap-regionmap-project-save.log
      - name: Exercise pinned cross-map connection undo and dirty-state boundary
        run: |
          python3 tools/phase1_porymap_cross_map_undo.py \
            --porymap upstream/porymap \
            --harness tests/phase1_porymap_cross_map_undo.cpp \
            --dossier docs/phase1-review-readiness/porymap-cross-map-undo-boundary-20261106.md \
            --output porymap-compiler-evidence/porymap-cross-map-undo.json \
            --archive porymap-compiler-evidence/porymap-cross-map-undo.tar.gz \
            --log porymap-compiler-evidence/porymap-cross-map-undo.log
      - name: Exercise pinned editor map-switch undo-group boundary
        run: |
          python3 tools/phase1_porymap_editor_map_switch.py \
            --porymap upstream/porymap \
            --harness tests/phase1_porymap_editor_map_switch.cpp \
            --dossier docs/phase1-review-readiness/porymap-editor-map-switch-20261106.md \
            --output porymap-compiler-evidence/porymap-editor-map-switch.json \
            --archive porymap-compiler-evidence/porymap-editor-map-switch.tar.gz \
            --log porymap-compiler-evidence/porymap-editor-map-switch.log
      - name: Configure original qmake Qt application
        run: |
          set -o pipefail
          cd upstream/porymap
          qmake6 porymap.pro 2>&1 | tee ../../porymap-qmake.log
      - name: Build pinned Porymap with compilation capture
        run: |
          set -o pipefail
          cd upstream/porymap
          bear --output compile_commands.json -- make -j2 2>&1 | tee ../../porymap-build.log
      - name: Verify actual compiled editor map symbols and source revisions
        run: python3 tools/porymap_compiled_semantics.py
      - name: Verify map inheritance and independent script/event source semantics
        run: python3 tools/porymap_shared_semantics.py
      - name: Verify Qt map model generated signal dispatch and linked symbols
        run: python3 tools/qt_metaobject_contracts.py
      - name: Retain compiled ABI evidence without application binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-phase1-porymap-Qt-compiled-semantic-evidence
          path: |
            porymap-compiler-evidence/
            porymap-qmake.log
            porymap-build.log
          retention-days: 90
          if-no-files-found: warn
