name: XGBA R22 real Emerald 100+ connected-map transitions and EWRAM churn
on:
  push:
    branches:
      - 'phase2/r22-emerald-map-churn-stress-20261111'
    paths:
      - 'integration/emerald/xgba_r19_connected_maps.inc'
      - 'integration/emerald/xgba_r17_external_littleroot.inc'
      - 'integration/mgba/xgba_r19_connected_maps.h'
      - 'integration/mgba/xgba_mgba_headless.c'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tools/xgba_mgba_run.py'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - 'tests/test_xgba_r19_connected_maps.py'
      - 'tests/test_xgba_r22_emerald_map_churn.py'
      - '.github/workflows/xgba-r22-emerald-map-churn.yml'
  pull_request:
    paths:
      - 'integration/emerald/xgba_r19_connected_maps.inc'
      - 'integration/mgba/xgba_r19_connected_maps.h'
      - 'integration/mgba/xgba_mgba_headless.c'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tests/test_xgba_r22_emerald_map_churn.py'
      - '.github/workflows/xgba-r22-emerald-map-churn.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgba-r22-native-map-churn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-original-emerald-one-hundred-map-crossings:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install actual Emerald and native mGBA build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev build-essential cmake python3-pil
      - name: Retrieve exact pinned game decomp and emulator sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          git clone --quiet --filter=blob:none https://github.com/pret/pokeemerald.git upstream/pokeemerald
          git -C upstream/pokeemerald checkout --quiet --detach 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          git clone --quiet --filter=blob:none https://github.com/mgba-emu/mgba.git upstream/mgba
          git -C upstream/mgba checkout --quiet --detach fd9dc5c2cbf234365068855851107e762fc6211b
          test "$(git -C upstream/pokeemerald rev-parse HEAD)" = 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          test "$(git -C upstream/mgba rev-parse HEAD)" = fd9dc5c2cbf234365068855851107e762fc6211b
      - name: Exercise original Emerald 102 real crossings and verify both external packs at every transition
        shell: bash
        env:
          XGBA_R22_EVIDENCE_DIR: ${{ github.workspace }}/r22-map-evidence
        run: |
          set -euo pipefail
          python3 -m py_compile tests/test_xgba_r22_emerald_map_churn.py tests/test_xgba_r17_emerald_external_map.py
          python3 -m unittest discover -s tests -p 'test_xgba_r22_emerald_map_churn.py' -v 2>&1 | tee xgba-r22-map.log
          grep -q 'Ran 7 tests' xgba-r22-map.log
          grep -q '^OK$' xgba-r22-map.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('r22-map-evidence')
          photos=sorted(root.glob('*.png'))
          assert len(photos)==6,photos
          for photo in photos:
              with Image.open(photo) as im:assert im.size==(240,160)
          report=json.loads((root/'proof.json').read_text())
          assert report['total_original_dpad_crossings'] == 102
          assert report['map_and_bg_vram_byte_verification_points'] == 103
          assert report['external_map_cache_misses_after_initial_load'] == 0
          assert report['forced_evictions_tested'] is False
          assert report['disabled_fail_closed_zero_provider_reads']
          assert not list(root.glob('*.gba')) and not list(root.glob('*.sav'))
          print('PASS_R22_NATIVE_EMERALD_102_MAP_CROSSINGS_7_TESTS')
          PY
      - name: Preserve only native Emerald LCD screenshots and evidence metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-r22-original-emerald-102-physical-crossings
          path: r22-map-evidence/
          retention-days: 90
          if-no-files-found: warn
