name: Phase 1 public repository exposure audit (read-only)
on:
  push:
    branches: ["phase1/firered-layout-writers-20261026"]
    paths:
      - "tools/phase1_public_exposure_scan.py"
      - ".github/workflows/phase1-public-exposure-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch reachable refs for history scan
        run: git fetch --all --tags --prune
      - name: Compile scanner and run synthetic negative controls
        run: |
          set -euo pipefail
          python3 -m py_compile tools/phase1_public_exposure_scan.py
          python3 tools/phase1_public_exposure_scan.py --self-test
      - name: Scan reachable Git blobs, archive members and commit messages without disclosing content
        run: |
          set -euo pipefail
          python3 tools/phase1_public_exposure_scan.py
      - name: Preserve redacted evidence report even on findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-public-exposure-redacted-report
          path: audit-output/public-exposure-scan.json
          if-no-files-found: warn
          retention-days: 30
