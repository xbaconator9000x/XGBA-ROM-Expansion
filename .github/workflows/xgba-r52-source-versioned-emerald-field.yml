name: XGBA R52 genuine Emerald source-versioned map camera, collision and 3-ROM traits
on:
  push:
    branches: ['integration/r51-original-three-world-grid-native-20261113']
    paths:
      - 'integration/common/xgba_r52_source_layout_profile.h'
      - 'integration/emerald/xgba_r52_native_source_layout.inc'
      - 'integration/emerald/xgba_r51_original_terrain.inc'
      - 'integration/emerald/xgba_r17_external_littleroot.inc'
      - 'tools/xgba_r52_source_layout_profiles.py'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - 'tests/test_xgba_r52_source_layout_profiles.py'
      - 'tests/xgba_r52_source_layout_native.c'
      - 'tests/test_xgba_r52_native_emerald_versioned_camera.py'
      - '.github/workflows/xgba-r52-source-versioned-emerald-field.yml'
  pull_request:
    branches: [main, 'integration/r50-guest-original-engine-events-20261113']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgba-r52-original-source-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  versioned-source-profiles:
    name: Original-version source layout indexes, FRLG traits, CRC and wrong source refusal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Full authored profile and private manifest format contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/xgba_r52_source_layout_profiles.py \
            tests/test_xgba_r52_source_layout_profiles.py tools/xgba_r17_emerald_patch.py
          PYTHONPATH=tools:tests python3 -m unittest \
            test_xgba_r52_source_layout_profiles.ExactOriginalLayoutProfileTests -v \
            2>&1 | tee r52-source-profiles.log
          grep -q '^OK$' r52-source-profiles.log
      - name: Native C11 pointer/metadata/CRC checks under ASan + UBSan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/r52
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/xgba_r52_source_layout_native.c -o build/r52/layouts
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 build/r52/layouts
  original-emerald-source-renderer:
    name: Actual Emerald field camera + collision split hook, ARM linker, mGBA and Flash
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Pinned original ARM compiler
        uses: carlosperate/arm-none-eabi-gcc-action@49f4db4520f840e77ab1e99b24cfac2c540a21b1
        with:
          release: '13.2.Rel1'
      - name: Original native-emulator deps
        shell: bash
        run: |
          set -euo pipefail
          bash tools/xgba_ci_png_prereqs.sh
          if ! python3 -c 'from PIL import Image' >/dev/null 2>&1; then
            python3 -m pip install --user --break-system-packages --disable-pip-version-check 'Pillow==11.3.0'
          fi
      - name: Pinned original game engine and mGBA
        run: |
          set -euo pipefail
          mkdir -p upstream
          git clone --quiet --filter=blob:none https://github.com/pret/pokeemerald.git upstream/pokeemerald
          git -C upstream/pokeemerald checkout --quiet --detach 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          git clone --quiet --filter=blob:none https://github.com/mgba-emu/mgba.git upstream/mgba
          git -C upstream/mgba checkout --quiet --detach fd9dc5c2cbf234365068855851107e762fc6211b
      - name: Build actual original Emerald versioned field renderer and run real Flash cycle
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools:tests:integration/mgba python3 -m unittest \
            test_xgba_r52_native_emerald_versioned_camera.NativeEmeraldR52VersionedWorld -v \
            2>&1 | tee r52-original-emerald-native.log
          grep -q '^OK$' r52-original-emerald-native.log
          echo PASS_R52_ACTUAL_EMERALD_512_640_CAMERA_COLLISION_HOOK_AND_FLASH
