name: XGBA fail-closed guest-memory budget contract
on:
  push:
    branches:
      - 'phase2/r15-firered-native-save-memory-policy-20261111'
    paths:
      - 'tools/xgba_memory_plan.py'
      - 'tests/test_xgba_memory_plan.py'
      - '.github/workflows/xgba-memory-plan.yml'
  pull_request:
    paths:
      - 'tools/xgba_memory_plan.py'
      - 'tests/test_xgba_memory_plan.py'
      - 'tests/test_xgba_r14_external_tilesets.py'
      - '.github/workflows/xgba-memory-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-memory-guard-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute reusable residency, overlap, alignment, and EWRAM failure tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/xgba_memory_plan.py tests/test_xgba_memory_plan.py
          python3 -m unittest discover -s tests -p 'test_xgba_memory_plan.py' -v 2>&1 | tee xgba-memory-plan.log
          test "$(grep -c ' ... ok
          if grep -q 'skipped=' xgba-memory-plan.log; then
            echo 'Memory checks may not be skipped'
            exit 1
          fi
          echo PASS_XGBA_SHARED_MEMORY_BUDGET_26_TESTS
 xgba-memory-plan.log)" -eq 26
          if grep -q 'skipped=' xgba-memory-plan.log; then
            echo 'Memory checks may not be skipped'
            exit 1
          fi
          echo PASS_XGBA_SHARED_MEMORY_BUDGET_12_TESTS
