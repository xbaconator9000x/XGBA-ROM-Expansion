name: Phase 1 second packet FireRed Five/Four Island source partials
on:
  push:
    branches:
      - phase1/review-readiness-handoff-20261027
  pull_request:
permissions:
  contents: read
jobs:
  firered-next-eight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify eight pinned scripts and 144 fail-closed negatives
        run: python3 tools/phase1_second_packet_firered_next_verify.py
