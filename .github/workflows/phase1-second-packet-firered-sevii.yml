name: Phase 1 second packet FireRed Sevii partial source
on:
  push:
    branches:
      - phase1/review-readiness-handoff-20261027
  pull_request:
permissions:
  contents: read
jobs:
  firered-sevii-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original Sevii scripts and 120 negatives
        run: python3 tools/phase1_second_packet_firered_sevii_verify.py
