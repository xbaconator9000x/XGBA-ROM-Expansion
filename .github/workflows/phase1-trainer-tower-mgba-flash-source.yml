name: Phase 1 pinned Trainer Tower mGBA Flash sector source
on:
  push:
    branches: ['phase1/**']
    paths:
      - tools/phase1_trainer_tower_mgba_flash_sector_source.py
      - .github/workflows/phase1-trainer-tower-mgba-flash-source.yml
  pull_request:
    paths:
      - tools/phase1_trainer_tower_mgba_flash_sector_source.py
      - docs/phase1-review-readiness/trainer-tower-mgba-flash-bank-20261029.md
      - .github/workflows/phase1-trainer-tower-mgba-flash-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: upstream-firered
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mgba-emu/mgba
          ref: fd9dc5c2cbf234365068855851107e762fc6211b
          path: upstream-mgba
          persist-credentials: false
      - name: Verify source and eleven negative controls
        run: |
          python3 -m py_compile tools/phase1_trainer_tower_mgba_flash_sector_source.py
          python3 tools/phase1_trainer_tower_mgba_flash_sector_source.py --firered upstream-firered --mgba upstream-mgba --output phase1-evidence/trainer-tower-mgba-flash-source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-trainer-tower-mgba-flash-source
          path: phase1-evidence/
          if-no-files-found: warn
