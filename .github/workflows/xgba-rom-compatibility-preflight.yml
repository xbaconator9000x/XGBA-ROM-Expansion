name: Phase 1 XGBA generic ROM identity preflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/xgba_rom_compatibility_preflight.py'
      - 'tests/test_xgba_rom_compatibility_preflight.py'
      - '.github/workflows/xgba-rom-compatibility-preflight.yml'
      - 'docs/XGBA_PLATFORM_COMPATIBILITY_SCOPE_2026-10-29.md'
  push:
    paths:
      - 'tools/xgba_rom_compatibility_preflight.py'
      - 'tests/test_xgba_rom_compatibility_preflight.py'
      - '.github/workflows/xgba-rom-compatibility-preflight.yml'

permissions:
  contents: read

jobs:
  no-automatic-binary-approval:
    name: Reject unknown and altered ROMs; verify inspect-only behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and deterministic negative cases
        run: |
          python3 -m py_compile tools/xgba_rom_compatibility_preflight.py tests/test_xgba_rom_compatibility_preflight.py
          python3 -m unittest discover -s tests -p test_xgba_rom_compatibility_preflight.py -v
