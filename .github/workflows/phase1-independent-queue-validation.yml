name: Phase 1 independent semantic queue bootstrap (no approvals)
on:
  pull_request:
    paths:
      - 'docs/PHASE1_INDEPENDENT_SEMANTIC_REVIEW_QUEUE.md'
      - 'semantic-snapshots/independent-reviews/**'
      - 'semantic-snapshots/curated/p0_semantic_review_candidates_2026-10-26.json'
      - 'semantic-snapshots/current/phase1_mapping_gate.json'
      - 'tools/phase1_independent_queue_validate.py'
      - 'tests/test_phase1_independent_queue.py'
      - '.github/workflows/phase1-independent-queue-validation.yml'
  push:
    paths:
      - 'docs/PHASE1_INDEPENDENT_SEMANTIC_REVIEW_QUEUE.md'
      - 'semantic-snapshots/independent-reviews/**'
      - 'tools/phase1_independent_queue_validate.py'
      - 'tests/test_phase1_independent_queue.py'
      - '.github/workflows/phase1-independent-queue-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify bootstrap queue and reject false independent approvals
        run: |
          python3 -m py_compile tools/phase1_independent_queue_validate.py tests/test_phase1_independent_queue.py
          python3 tools/phase1_independent_queue_validate.py
          python3 -m unittest discover -s tests -p 'test_phase1_independent_queue.py' -v
