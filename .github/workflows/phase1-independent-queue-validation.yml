name: Phase 1 independent semantic queue bootstrap (no approvals)
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify bootstrap queue and reject false independent approvals
        run: |
          python3 -m py_compile tools/phase1_independent_queue_validate.py tests/test_phase1_independent_queue.py
          python3 tools/phase1_independent_queue_validate.py
          python3 -m unittest discover -s tests -p 'test_phase1_independent_queue.py' -v
