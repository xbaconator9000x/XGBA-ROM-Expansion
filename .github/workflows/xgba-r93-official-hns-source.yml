name: XGBA R93 official open-source HnS v2.0.6 Goldenrod build
on:
  push:
    branches: ['integration/r51-original-three-world-grid-native-20261113']
    paths:
      - 'tools/xgba_r93_hns_official_source.py'
      - 'tests/test_xgba_r93_hns_official_source.py'
      - '.github/workflows/xgba-r93-official-hns-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-built-goldenrod-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Authored source-provenance and native R53 bridge tests
        run: python3 -m unittest discover -s tests -p 'test_xgba_r93_hns_official_source.py' -v
      - name: Checkout exact public original Heart and Soul 2.0.6 source
        uses: actions/checkout@v4
        with:
          repository: PokemonHnS-Development/pokehns-expansion
          ref: 167aa6d537b109bb229c231ddce4616974c4da71
          path: upstream-hns-v206
          persist-credentials: false
      - name: Original ARM compiler (the upstream HnS build dependencies)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev
      - name: Actual released Heart and Soul source ARM build
        working-directory: upstream-hns-v206
        env:
          GAME_VERSION: HNS
          COMPARE: 0
        run: |
          make hns -j2 -O
          test -s pokehns.gba
          test -s pokeemerald.elf
      - name: Build original source-linked Goldenrod BG into private XGBA R53 resource pages
        run: |
          PYTHONPATH=tools python3 tools/xgba_r93_hns_official_source.py \
            --source-tree upstream-hns-v206 \
            --built-gba upstream-hns-v206/pokehns.gba \
            --built-elf upstream-hns-v206/pokeemerald.elf \
            --private-out "$RUNNER_TEMP/r93-open-source-goldenrod"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ['RUNNER_TEMP'])/'r93-open-source-goldenrod'/'provenance.json').read_text())
          assert len(x["tilesets"])==2
          assert x["resources"]>=10
          assert not x["actual_player_three_world_fly_complete"]
          print("PASS_R93_HNS_V206_REAL_SOURCE_LINKED_GOLDENROD_BG",x["resources"])
          PY
      # Do not upload built game ROM, packed art or assets. Log provenance only.
