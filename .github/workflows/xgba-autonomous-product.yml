name: XGBA autonomous product dispatcher (bounded)
on:
  pull_request:
    paths:
      - 'tools/xgba_autonomous_product.py'
      - 'tests/test_xgba_autonomous_product.py'
      - '.github/workflows/xgba-autonomous-product.yml'
      - 'docs/XGBA_AUTONOMY_RUNBOOK_20261110.md'
  push:
    branches: [main]
    paths:
      - 'tools/xgba_autonomous_product.py'
      - 'tests/test_xgba_autonomous_product.py'
      - '.github/workflows/xgba-autonomous-product.yml'
  schedule:
    - cron: '23,53 * * * *'
  workflow_run:
    workflows: ['XGBA opt-in resource prototype CI']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: xgba-product-agent-queue
  cancel-in-progress: false
jobs:
  validate-and-advance:
    # workflow_run executes default-branch code with secrets; never trust a
    # different repository/branch's workflow name, event or conclusion.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'phase1/xgba-optin-resource-prototype-20261110' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
      XGBA_COPILOT_AGENT_PAT: ${{ secrets.XGBA_COPILOT_AGENT_PAT }}
      XGBA_AUTONOMY_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Offline regression and fail-closed preflight
        run: |
          set -euo pipefail
          python3 -m py_compile tools/xgba_autonomous_product.py tests/test_xgba_autonomous_product.py
          python3 -m unittest discover -s tests -p test_xgba_autonomous_product.py -v
          python3 tools/xgba_autonomous_product.py --mode dry-run
      - name: Advance ONE task at most (default branch only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Python re-checks exact current PR HEAD; stale CI triggers are read-only.
          XGBA_WAKE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 tools/xgba_autonomous_product.py --mode run
