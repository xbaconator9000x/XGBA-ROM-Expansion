name: XGBA R28 three-map two-slot cache contract
on:
  push:
    branches: [main, 'phase3/r28-three-map-cache-eviction-20261112']
    paths:
      - 'integration/common/xgba_map_cache.h'
      - 'integration/emerald/xgba_r19_connected_maps.inc'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - 'tests/test_xgba_r28_map_cache.c'
      - 'tests/test_xgba_r28_emerald_three_maps.py'
      - '.github/workflows/xgba-r28-three-map-cache.yml'
  pull_request:
    branches: [main]
    paths:
      - 'integration/common/xgba_map_cache.h'
      - 'integration/emerald/xgba_r19_connected_maps.inc'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - 'tests/test_xgba_r28_map_cache.c'
      - 'tests/test_xgba_r28_emerald_three_maps.py'
      - '.github/workflows/xgba-r28-three-map-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgba-r28-cache-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-c-cache-lifetime:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute actual production cache header in strict C
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -o /tmp/xgba-r28-map-cache-tests tests/test_xgba_r28_map_cache.c
          /tmp/xgba-r28-map-cache-tests 2>&1 | tee /tmp/xgba-r28-cache.log
          grep -q 'PASS_R28_PORTABLE_CACHE_CONTRACT 16/16' /tmp/xgba-r28-cache.log
          echo 'PASS_R28_PORTABLE_ONLY not_an_original_game_native_result=1'
