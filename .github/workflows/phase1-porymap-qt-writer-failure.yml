name: Phase 1 pinned Porymap Qt writer failure boundary
on:
  push:
    paths:
      - 'tools/phase1_porymap_qt_writer_failure.py'
      - 'tests/porymap_qt_writer_device.cpp'
      - 'docs/PHASE1_P0_PORYMAP_QT_WRITER_FAILURE_2026-10-27.md'
      - '.github/workflows/phase1-porymap-qt-writer-failure.yml'
  pull_request:
    paths:
      - 'tools/phase1_porymap_qt_writer_failure.py'
      - 'tests/porymap_qt_writer_device.cpp'
      - 'docs/PHASE1_P0_PORYMAP_QT_WRITER_FAILURE_2026-10-27.md'
      - '.github/workflows/phase1-porymap-qt-writer-failure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-qt-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable Porymap source
        uses: actions/checkout@v4
        with:
          repository: huderlem/porymap
          ref: 26b919d7ff4b54152de010abd5bf344af2ebe116
          path: upstream-porymap
          persist-credentials: false
      - name: Verify source syntax and exact pinned provenance
        run: |
          set -euo pipefail
          python3 -m py_compile tools/phase1_porymap_qt_writer_failure.py
          python3 tools/phase1_porymap_qt_writer_failure.py \
            --porymap upstream-porymap \
            --output phase1-evidence/porymap-qt-writer-source.json
      - name: Install Qt6 host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev pkg-config g++
          pkg-config --modversion Qt6Core
      - name: Compile and execute pinned Qt serializer success and failure controls
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -Wall -Wextra \
            -I upstream-porymap/include/lib \
            tests/porymap_qt_writer_device.cpp \
            upstream-porymap/src/lib/orderedjson.cpp \
            $(pkg-config --cflags --libs Qt6Core) \
            -o phase1-porymap-qt-writer-device
          ./phase1-porymap-qt-writer-device | tee phase1-evidence/porymap-qt-writer-device.json
          python3 -m json.tool phase1-evidence/porymap-qt-writer-device.json >/dev/null
      - name: Archive provenance and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-porymap-qt-writer-failure
          path: phase1-evidence/
          if-no-files-found: warn
          retention-days: 90
