name: Phase 1 original Porymap OrderedJsonDoc native Qt ENOSPC
on:
  push:
    branches:
      - phase1/porymap-full-qt-project-roundtrip-20261028
    paths:
      - 'tests/phase1_porymap_orderedjson_native.cpp'
      - 'tools/phase1_porymap_orderedjson_native_enospc.py'
      - 'docs/phase1-review-readiness/porymap-orderedjson-native-enospc-20261029.md'
      - '.github/workflows/phase1-porymap-orderedjson-native-enospc.yml'
  pull_request:
    paths:
      - 'tests/phase1_porymap_orderedjson_native.cpp'
      - 'tools/phase1_porymap_orderedjson_native_enospc.py'
      - 'docs/phase1-review-readiness/porymap-orderedjson-native-enospc-20261029.md'
      - '.github/workflows/phase1-porymap-orderedjson-native-enospc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-orderedjson-native-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: huderlem/porymap
          ref: 26b919d7ff4b54152de010abd5bf344af2ebe116
          path: upstream-porymap
          persist-credentials: false
      - name: Install existing Qt and syscall tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qt6-base-dev strace pkg-config
      - name: Compile and execute unchanged OrderedJsonDoc with real ENOSPC
        run: |
          set -euo pipefail
          python3 -m py_compile tools/phase1_porymap_orderedjson_native_enospc.py
          python3 tools/phase1_porymap_orderedjson_native_enospc.py \
            --porymap upstream-porymap \
            --harness tests/phase1_porymap_orderedjson_native.cpp \
            --log phase1-evidence/porymap-orderedjson-native.log \
            --trace phase1-evidence/porymap-orderedjson-native-strace.log \
            --output phase1-evidence/porymap-orderedjson-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-porymap-orderedjson-native-enospc
          path: phase1-evidence/
          if-no-files-found: warn
          retention-days: 90
