name: Phase 1 remaining P0 eight emulator/editor interop dossiers
on:
  workflow_call:
permissions:
  contents: read
jobs:
  remaining-p0-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify eight additional pinned P0 sources and 88 negatives
        run: python3 tools/phase1_remaining_p0_eight_interop_verify.py
