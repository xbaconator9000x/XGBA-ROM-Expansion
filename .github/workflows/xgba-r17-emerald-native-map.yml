name: XGBA R17 genuine Emerald external Littleroot tileset and map
on:
  push:
    branches:
      - 'phase2/r17-emerald-external-littleroot-native-20261111'
    paths:
      - 'integration/emerald/xgba_r17_external_littleroot.inc'
      - 'integration/mgba/xgba_r17_emerald_map.h'
      - 'integration/mgba/xgba_mgba_headless.c'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tools/xgba_r17_emerald_heap.py'
      - 'tools/xgba_mgba_run.py'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - '.github/workflows/xgba-r17-emerald-native-map.yml'
  pull_request:
    paths:
      - 'integration/emerald/xgba_r17_external_littleroot.inc'
      - 'integration/mgba/xgba_r17_emerald_map.h'
      - 'integration/mgba/xgba_mgba_headless.c'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tools/xgba_r17_emerald_heap.py'
      - 'tools/xgba_mgba_run.py'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - '.github/workflows/xgba-r17-emerald-native-map.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgba-r17-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-emerald-real-map-and-bg-vram:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install source-built Emerald and native mGBA dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev build-essential cmake python3-pil
      - name: Checkout exact audited upstream Emerald and patched mGBA base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          git clone --quiet --filter=blob:none https://github.com/pret/pokeemerald.git upstream/pokeemerald
          git -C upstream/pokeemerald checkout --quiet --detach 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          git clone --quiet --filter=blob:none https://github.com/mgba-emu/mgba.git upstream/mgba
          git -C upstream/mgba checkout --quiet --detach fd9dc5c2cbf234365068855851107e762fc6211b
          test "$(git -C upstream/pokeemerald rev-parse HEAD)" = 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          test "$(git -C upstream/mgba rev-parse HEAD)" = fd9dc5c2cbf234365068855851107e762fc6211b
      - name: Execute real Emerald fieldmap, secondary tileset, BG VRAM and physical D-pad acceptance
        shell: bash
        env:
          XGBA_R17_EVIDENCE_DIR: ${{ github.workspace }}/r17-evidence
        run: |
          set -euo pipefail
          python3 -m py_compile tools/xgba_r17_emerald_patch.py tools/xgba_r17_emerald_heap.py tests/test_xgba_r17_emerald_external_map.py
          python3 -m unittest discover -s tests -p 'test_xgba_r17_emerald_external_map.py' -v 2>&1 | tee xgba-r17-native.log
          grep -q 'Ran 6 tests' xgba-r17-native.log
          grep -q '^OK$' xgba-r17-native.log
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          folder=Path("r17-evidence")
          shots=sorted(folder.glob("*.png"))
          assert len(shots)==2,shots
          for shot in shots:
              with Image.open(shot) as image:assert image.size==(240,160)
          proof=json.loads((folder/"proof.json").read_text())
          assert proof["native_memory_vram_and_grid_verified"]
          assert proof["physical_dpad"]
          assert proof["original_full_littleroot_grid_not_in_rom"]
          assert not list(folder.glob("*.gba")) and not list(folder.glob("*.sav")) and not list(folder.glob("*.bin"))
          print("PASS_R17_NATIVE_POKEEMERALD_EXTERNAL_LITTLEROOT_6_TESTS")
          PY
      - name: Upload actual native Emerald LCD frames and evidence metadata only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-r17-original-emerald-external-littleroot
          path: r17-evidence/
          retention-days: 90
          if-no-files-found: error
