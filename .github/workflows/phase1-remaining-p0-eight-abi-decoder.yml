name: Phase 1 remaining P0 ABI decoder original-source partial dossiers
on:
  push:
    branches:
      - phase1/review-readiness-handoff-20261027
  pull_request:
permissions:
  contents: read
jobs:
  abi-decoder-partial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify eight exact pinned source files and 112 fail-closed controls
        run: python3 tools/phase1_remaining_p0_eight_abi_decoder_verify.py
