name: XGBA R27 native original Emerald huge-map geometry and fail-closed bounds
on:
  push:
    branches: [main]
    paths:
      - 'integration/emerald/xgba_r17_external_littleroot.inc'
      - 'integration/mgba/xgba_r17_emerald_map.h'
      - 'tools/xgba_r27_huge_map_geometry.py'
      - 'tests/test_xgba_r27_map_capacity.py'
      - 'tests/test_xgba_r27_emerald_huge_maps.py'
      - '.github/workflows/xgba-r27-huge-map-stress.yml'
  pull_request:
    branches: [main]
    paths:
      - 'integration/emerald/xgba_r17_external_littleroot.inc'
      - 'integration/mgba/xgba_r17_emerald_map.h'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - 'tools/xgba_r27_huge_map_geometry.py'
      - 'tests/test_xgba_r27_map_capacity.py'
      - 'tests/test_xgba_r27_emerald_huge_maps.py'
      - '.github/workflows/xgba-r27-huge-map-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgba-r27-large-map-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-geometry-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove 64x64, 128x32, original 0x2800 backup ceiling and 16385-byte rejection
        run: |
          set -euo pipefail
          python3 -m py_compile tools/xgba_r27_huge_map_geometry.py tests/test_xgba_r27_map_capacity.py
          PYTHONPATH=tools:tests python3 -m unittest discover -s tests -p 'test_xgba_r27_map_capacity.py' -v 2>&1 | tee r27-portable.log
          grep -q 'Ran 7 tests' r27-portable.log
          grep -q '^OK$' r27-portable.log

  original-emerald-huge-map-stress:
    # One fresh upstream checkout per map shape. The R7 native patch must
    # refuse a dirty mGBA checkout; never reset or bypass its safety guard.
    name: Original Emerald native map ${{ matrix.shape }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - shape: "64x64"
            test_class: RealEmeraldHuge64x64
          - shape: "128x32"
            test_class: RealEmeraldHuge128x32
    steps:
      - uses: actions/checkout@v4
      - name: Install source-built Emerald and native mGBA dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev build-essential cmake python3-pil
      - name: Checkout exact audited upstream Emerald and patched mGBA base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          git clone --quiet --filter=blob:none https://github.com/pret/pokeemerald.git upstream/pokeemerald
          git -C upstream/pokeemerald checkout --quiet --detach 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          git clone --quiet --filter=blob:none https://github.com/mgba-emu/mgba.git upstream/mgba
          git -C upstream/mgba checkout --quiet --detach fd9dc5c2cbf234365068855851107e762fc6211b
          test "$(git -C upstream/pokeemerald rev-parse HEAD)" = 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          test "$(git -C upstream/mgba rev-parse HEAD)" = fd9dc5c2cbf234365068855851107e762fc6211b
      - name: Execute pinned original Emerald map ${{ matrix.shape }} in its own clean native mGBA checkout
        shell: bash
        env:
          XGBA_R27_EVIDENCE_DIR: ${{ github.workspace }}/r27-evidence
        run: |
          set -euo pipefail
          python3 -m py_compile tools/xgba_r27_huge_map_geometry.py tests/test_xgba_r17_emerald_external_map.py tests/test_xgba_r27_emerald_huge_maps.py
          PYTHONPATH=tools:tests:integration/mgba python3 -m unittest "test_xgba_r27_emerald_huge_maps.${{ matrix.test_class }}" -v 2>&1 | tee xgba-r27-native.log
          grep -q 'Ran 7 tests' xgba-r27-native.log
          grep -q '^OK$' xgba-r27-native.log
          XGBA_R27_SHAPE='${{ matrix.shape }}' python3 - <<'PY'
          import os,json
          from pathlib import Path
          from PIL import Image
          name=os.environ["XGBA_R27_SHAPE"]
          w,h=(int(v) for v in name.split("x"))
          root=Path("r27-evidence")
          proof=json.loads((root/f"proof-{name}.json").read_text())
          assert proof["stressed_map_geometry"]=={"width":w,"height":h}
          assert proof["native_memory_vram_and_grid_verified"]
          assert proof["external_bytes"]==13636
          assert proof["original_emerald_native_all_map_cells_checked"]==4096
          assert proof["complete_full_secondary_tileset"]
          assert "PASS_R27_REAL_EMERALD_HUGE_MAP" in proof["enabled_log"]
          assert "PASS_R17_DISABLED_EMERALD_MAP_FAIL_CLOSED" in proof["disabled_log"]
          imgs=sorted(root.glob(f"{name}-*.png"))
          assert len(imgs)==2,imgs
          for path in imgs:
              with Image.open(path) as im:
                  assert im.size==(240,160)
          assert not list(root.glob("*.gba")) and not list(root.glob("*.sav")) and not list(root.glob("*.bin"))
          print(f"PASS_R27_ORIGINAL_EMERALD_MAP shape={name} grid_cells={w*h} backup_cells={(w+15)*(h+14)} native_lcd_pngs={len(imgs)}")
          PY
      - name: Save original-game LCD + machine proof for ${{ matrix.shape }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-r27-original-emerald-huge-map-${{ matrix.shape }}
          path: r27-evidence/
          retention-days: 90
          if-no-files-found: warn
