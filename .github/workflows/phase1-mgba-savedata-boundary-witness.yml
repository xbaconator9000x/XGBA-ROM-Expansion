permissions:
  contents: read
jobs:
  pinned-savedata-boundary-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        env:
          PYTHONPYCACHEPREFIX: /tmp/xgba-phase1-python-cache
        run: python3 -m py_compile tools/phase1_mgba_savedata_boundary_witness.py tools/phase1_mgba_savedata_handoff_verify.py tools/phase1_mgba_saveconverter_eeprom_tail.py tools/phase1_mgba_saveconverter_gba_off.py tools/phase1_mgba_saveconverter_qfile.py tools/phase1_mgba_vfs_fd_native.py tools/phase1_mgba_vfs_fd_teardown_native.py tools/phase1_mgba_vfs_fd_allocation_native.py tools/phase1_mgba_core_loadsave_allocation_recovery.py tools/phase1_mgba_core_autoload_save.py tools/phase1_mgba_core_savestate_clone.py tools/phase1_mgba_gba_clone_vfile_alloc.py tools/phase1_mgba_savestate_restore_consumer.py tools/phase1_mgba_savestate_caller_integration.py tools/phase1_mgba_vfs_stdio_native.py tools/phase1_mgba_cross_backend_observability.py tools/phase1_mgba_platform_observer_closure.py tools/phase1_mgba_fault_observer_handoff.py tools/phase1_mgba_observer_receipt_eligibility.py tools/phase1_mgba_vfs_fd_callback_native.py tools/phase1_mgba_frontend_log_observers.py tools/phase1_mgba_frontend_runtime_feasibility.py tools/phase1_mgba_headless_timeout_diagnostic.py tools/phase1_mgba_headless_runtime_sync.py tools/phase1_mgba_qt_restore_caller.py tools/phase1_mgba_sdl_restore_caller.py
      - name: Fail-closed EEPROM parser and fixture controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_saveconverter_eeprom_tail.py" -v
      - name: Fail-closed QFile observation parser and 17 adversarial controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_saveconverter_qfile.py" -v
      - name: Fail-closed Linux VFile native evidence controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_vfs_fd_native.py" -v
      - name: Fail-closed Linux VFile teardown evidence controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_vfs_fd_teardown_native.py" -v
      - name: Fail-closed Linux VFile allocation-failure ownership controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_vfs_fd_allocation_native.py" -v
      - name: Fail-closed mCore save-caller allocation recovery controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_core_loadsave_allocation_recovery.py" -v
      - name: Fail-closed mCore autoload caller ownership controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_core_autoload_save.py" -v
      - name: Fail-closed mCore savestate clone caller controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_core_savestate_clone.py" -v
      - name: Fail-closed GBA clone VFile allocation controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_gba_clone_vfile_alloc.py" -v
      - name: Fail-closed savestate restore-consumer controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_savestate_restore_consumer.py" -v
      - name: Fail-closed savestate caller-integration controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_savestate_caller_integration.py" -v
      - name: Fail-closed Linux stdio VFile evidence controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_vfs_stdio_native.py" -v
      - name: Fail-closed cross-backend save observability controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_cross_backend_observability.py" -v
      - name: Fail-closed platform save observer closure controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_platform_observer_closure.py" -v
      - name: Fail-closed fault-to-observer handoff controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_fault_observer_handoff.py" -v
      - name: Fail-closed observer receipt eligibility controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_observer_receipt_eligibility.py" -v
      - name: Fail-closed GBA savedata callback evidence controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_vfs_fd_callback_native.py" -v
      - name: Fail-closed pinned host log-observer controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_frontend_log_observers.py" -v
      - name: Fail-closed frontend runtime feasibility controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_frontend_runtime_feasibility.py" -v
      - name: Fail-closed headless timeout diagnostic controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_headless_timeout_diagnostic.py" -v
      - name: Fail-closed pinned headless runtime sync controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_headless_runtime_sync.py" -v
      - name: Fail-closed native Qt restore caller controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_qt_restore_caller.py" -v
      - name: Fail-closed SDL restore caller controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_sdl_restore_caller.py" -v
      - name: Fetch exact pinned mGBA source
        run: |
          git clone --quiet --filter=blob:none https://github.com/mgba-emu/mgba.git /tmp/xgba-mgba-boundary
          git -C /tmp/xgba-mgba-boundary checkout --quiet fd9dc5c2cbf234365068855851107e762fc6211b
      - name: Verify pinned cross-backend error observers
        run: |
          python3 tools/phase1_mgba_cross_backend_observability.py \
            --checkout /tmp/xgba-mgba-boundary
      - name: Verify pinned platform save observers
        run: |
          python3 tools/phase1_mgba_platform_observer_closure.py \
            --checkout /tmp/xgba-mgba-boundary
      - name: Verify pinned frontend runtime feasibility
        run: |
          python3 tools/phase1_mgba_frontend_runtime_feasibility.py \
            --checkout /tmp/xgba-mgba-boundary
      - name: Verify headless timeout diagnostic provenance
        run: |
          python3 tools/phase1_mgba_headless_timeout_diagnostic.py \
            --checkout /tmp/xgba-mgba-boundary
      - name: Verify pinned fault-to-observer handoff
        run: |
          python3 tools/phase1_mgba_fault_observer_handoff.py \
            --checkout /tmp/xgba-mgba-boundary
      - name: Emit pinned observer receipt eligibility report
        run: |
          python3 tools/phase1_mgba_observer_receipt_eligibility.py \
            --checkout /tmp/xgba-mgba-boundary \
            --head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Execute pinned Linux fd VFile and savedata cleanup
        run: |
          python3 tools/phase1_mgba_vfs_fd_native.py \
            --checkout /tmp/xgba-mgba-boundary \
            --harness tests/phase1_mgba_vfs_fd_native.c
      - name: Execute pinned native VFile teardown error matrix
        run: |
          python3 tools/phase1_mgba_vfs_fd_teardown_native.py \
            --checkout /tmp/xgba-mgba-boundary \
            --harness tests/phase1_mgba_vfs_fd_teardown_native.c
      - name: Execute pinned compiled POSIX VFile allocation-failure ownership witness
        run: |
          python3 tools/phase1_mgba_vfs_fd_allocation_native.py \
            --checkout /tmp/xgba-mgba-boundary \
            --harness tests/phase1_mgba_vfs_fd_allocation_native.c
      - name: Execute pinned mCore save-caller allocation failure and retry witness
        run: |
          python3 tools/phase1_mgba_core_loadsave_allocation_recovery.py \
            --checkout /tmp/xgba-mgba-boundary \
            --harness tests/phase1_mgba_core_loadsave_allocation_recovery.c
      - name: Execute pinned mCore autoload caller ownership witness
        run: |
          python3 tools/phase1_mgba_core_autoload_save.py \
            --checkout /tmp/xgba-mgba-boundary \
            --harness tests/phase1_mgba_core_autoload_save.c
      - name: Execute pinned mCore savestate clone caller witness
        run: |
          python3 tools/phase1_mgba_core_savestate_clone.py \
            --checkout /tmp/xgba-mgba-boundary \
            --harness tests/phase1_mgba_core_savestate_clone.c
      - name: Execute pinned GBA clone VFile allocation failure and recovery witness
        run: |
          python3 tools/phase1_mgba_gba_clone_vfile_alloc.py \
            --checkout /tmp/xgba-mgba-boundary \
            --harness tests/phase1_mgba_gba_clone_vfile_alloc.c
      - name: Execute pinned mCore savestate restore consumer and teardown witness
        run: |
