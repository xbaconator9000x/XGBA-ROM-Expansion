name: Phase 1 pinned mGBA savedata boundary witness (no approvals)
on:
  pull_request:
    paths:
      - 'tools/phase1_mgba_savedata_boundary_witness.py'
      - 'tools/phase1_mgba_savedata_handoff_verify.py'
      - 'tools/phase1_mgba_saveconverter_native.py'
      - 'tests/phase1_mgba_saveconverter_native.cpp'
      - 'tools/phase1_mgba_saveconverter_core_lifetime.py'
      - 'tests/phase1_mgba_saveconverter_core_lifetime.cpp'
      - 'tools/phase1_mgba_saveconverter_eeprom_tail.py'
      - 'tests/phase1_mgba_saveconverter_eeprom_tail.cpp'
      - 'tests/test_phase1_mgba_saveconverter_eeprom_tail.py'
      - 'tools/phase1_mgba_saveconverter_gba_off.py'
      - 'tools/phase1_mgba_saveconverter_qfile.py'
      - 'tests/phase1_mgba_saveconverter_qfile.cpp'
      - 'tests/test_phase1_mgba_saveconverter_qfile.py'
      - 'docs/phase1-review-readiness/mgba-savedata-boundary-witness-20261027.md'
      - 'docs/phase1-review-readiness/mgba-saveconverter-core-lifetime-asan-20261101.md'
      - 'docs/phase1-review-readiness/mgba-saveconverter-eeprom-tail-gba-off-20261102.md'
      - '.github/workflows/phase1-mgba-savedata-boundary-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-savedata-boundary-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: python3 -m py_compile tools/phase1_mgba_savedata_boundary_witness.py tools/phase1_mgba_savedata_handoff_verify.py tools/phase1_mgba_saveconverter_eeprom_tail.py tools/phase1_mgba_saveconverter_gba_off.py tools/phase1_mgba_saveconverter_qfile.py
      - name: Fail-closed EEPROM parser and fixture controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_saveconverter_eeprom_tail.py" -v
      - name: Fail-closed QFile observation parser and 17 adversarial controls
        run: python3 -m unittest discover -s tests -p "test_phase1_mgba_saveconverter_qfile.py" -v
      - name: Fetch exact pinned mGBA source
        run: |
          git clone --quiet --filter=blob:none https://github.com/mgba-emu/mgba.git /tmp/xgba-mgba-boundary
          git -C /tmp/xgba-mgba-boundary checkout --quiet fd9dc5c2cbf234365068855851107e762fc6211b
      - name: Execute pinned C function bodies against bounded mock VFile
        run: python3 tools/phase1_mgba_savedata_boundary_witness.py --checkout /tmp/xgba-mgba-boundary
      - name: Execute pinned getStatePlatform body under ASan and UBSan
        run: |
          python3 -m py_compile tools/phase1_mgba_saveconverter_core_lifetime.py
          python3 tools/phase1_mgba_saveconverter_core_lifetime.py \
            --checkout /tmp/xgba-mgba-boundary \
            --harness tests/phase1_mgba_saveconverter_core_lifetime.cpp
      - name: Install native Qt6 Core for SaveConverter witness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev qt6-multimedia-dev pkg-config g++
      - name: Execute pinned SaveConverter body with native Qt6 QIODevice
        run: |
          python3 -m py_compile tools/phase1_mgba_saveconverter_native.py
          python3 tools/phase1_mgba_saveconverter_native.py \
            --checkout /tmp/xgba-mgba-boundary \
            --harness tests/phase1_mgba_saveconverter_native.cpp
      - name: Execute pinned EEPROM RTC-tail conversion with native Qt6
        run: |
          python3 tools/phase1_mgba_saveconverter_eeprom_tail.py \
            --checkout /tmp/xgba-mgba-boundary \
            --harness tests/phase1_mgba_saveconverter_eeprom_tail.cpp \
            --root .
      - name: Execute pinned SaveConverter with native Qt6 QFile
        run: |
          python3 tools/phase1_mgba_saveconverter_qfile.py \
            --checkout /tmp/xgba-mgba-boundary \
            --harness tests/phase1_mgba_saveconverter_qfile.cpp
      - name: Compile pinned Qt translation unit with GBA core enabled
        run: |
          python3 tools/phase1_mgba_saveconverter_gba_off.py \
            --checkout /tmp/xgba-mgba-boundary \
            --core-gba ON \
            --build-dir /tmp/xgba-mgba-gba-on-qt
      - name: Compile pinned Qt translation unit with GBA core disabled
        run: |
          python3 tools/phase1_mgba_saveconverter_gba_off.py \
            --checkout /tmp/xgba-mgba-boundary \
            --core-gba OFF \
            --build-dir /tmp/xgba-mgba-gba-off-qt
