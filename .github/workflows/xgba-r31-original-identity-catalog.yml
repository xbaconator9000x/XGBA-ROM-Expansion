name: XGBA R31 original Emerald map identities source-derived resolver
on:
  push:
    branches: [main, 'phase3/r31-original-identity-catalog-20261112']
    paths:
      - 'integration/common/xgba_original_map_catalog.h'
      - 'integration/emerald/xgba_r19_connected_maps.inc'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - 'tools/xgba_r31_map_catalog.py'
      - 'tests/test_xgba_r31_original_catalog.c'
      - 'tests/test_xgba_r31_catalog_generation.py'
      - 'tests/test_xgba_r31_emerald_catalog.py'
      - '.github/workflows/xgba-r31-original-identity-catalog.yml'
  pull_request:
    branches: [main]
    paths:
      - 'integration/common/xgba_original_map_catalog.h'
      - 'integration/emerald/xgba_r19_connected_maps.inc'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - 'tools/xgba_r31_map_catalog.py'
      - 'tests/test_xgba_r31_original_catalog.c'
      - 'tests/test_xgba_r31_catalog_generation.py'
      - 'tests/test_xgba_r31_emerald_catalog.py'
      - '.github/workflows/xgba-r31-original-identity-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgba-r31-catalog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-original-identity-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compile real resolver and test original identity with strict C11
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -o /tmp/xgba-r31-original tests/test_xgba_r31_original_catalog.c
          /tmp/xgba-r31-original | tee r31-portable-c.log
          grep -q 'PASS_R31_ORIGINAL_MAP_IDENTITY' r31-portable-c.log
      - name: Fuzz source groups, reordering, unsafe resources and fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/xgba_r31_map_catalog.py tests/test_xgba_r31_catalog_generation.py
          PYTHONPATH=tools:tests python3 -m unittest test_xgba_r31_catalog_generation.OriginalIdentityGeneration -v 2>&1 | tee r31-source-catalog.log
          grep -q 'Ran 7 tests' r31-source-catalog.log
          grep -q '^OK$' r31-source-catalog.log
  original-emerald-source-derived-resolver:
    name: Original Emerald source-generated catalogue with genuine D-pad and LCD
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install native Emerald toolchain and emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev build-essential cmake python3-pil
      - name: Checkout exact original Emerald and mGBA source pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          git clone --quiet --filter=blob:none https://github.com/pret/pokeemerald.git upstream/pokeemerald
          git -C upstream/pokeemerald checkout --quiet --detach 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          git clone --quiet --filter=blob:none https://github.com/mgba-emu/mgba.git upstream/mgba
          git -C upstream/mgba checkout --quiet --detach fd9dc5c2cbf234365068855851107e762fc6211b
          test "$(git -C upstream/pokeemerald rev-parse HEAD)" = 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          test "$(git -C upstream/mgba rev-parse HEAD)" = fd9dc5c2cbf234365068855851107e762fc6211b
      - name: Execute 12 original-game regression cases using generated original map identities
        shell: bash
        env:
          XGBA_R30_EVIDENCE_DIR: ${{ github.workspace }}/r31-evidence
        run: |
          set -euo pipefail
          python3 -m py_compile tools/xgba_r31_map_catalog.py tests/test_xgba_r17_emerald_external_map.py tests/test_xgba_r31_emerald_catalog.py
          PYTHONPATH=tools:tests:integration/mgba python3 -m unittest test_xgba_r31_emerald_catalog.RealEmeraldOriginalIdentityCatalogue -v 2>&1 | tee r31-native.log
          grep -q 'Ran 12 tests' r31-native.log
          grep -q '^OK$' r31-native.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path("r31-evidence")
          report=json.loads((p/"proof.json").read_text())
          assert report["source_map_sequence"]==[9,16,10,17,10,16,9]
          assert report["actual_guest_ewram_reservation_bytes"]==16384
          assert "PASS_R30_REAL_EMERALD_FOUR_MAP_EVICTION" in report["native_c_log"]
          assert "PASS_R30_DISABLED_ORIGINAL_EMERALD_ZERO_PROVIDER_READS" in report["disabled_log"]
          pictures=sorted(p.glob("*.png"))
          assert len(pictures)==7, pictures
          for picture in pictures:
              with Image.open(picture) as im:assert im.size==(240,160)
          print("PASS_R31_ORIGINAL_EMERALD_SOURCE_CATALOG 12/12 original_ids=1 no_reindex=1 original_game=1 seven_LCD=1")
          PY
      - name: Retain real original-game screenshots and native proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-r31-original-emerald-source-generated-map-identity
          path: |
            r31-evidence/
            r31-native.log
          retention-days: 90
          if-no-files-found: warn
