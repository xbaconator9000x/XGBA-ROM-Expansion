name: Phase 1 remaining P0 original GBA runtime source dossiers
on:
  push:
    branches:
      - phase1/review-readiness-handoff-20261027
  pull_request:
permissions:
  contents: read
jobs:
  gba-runtime-partial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify eight pinned GBA runtime source files and 112 negative controls
        run: python3 tools/phase1_remaining_p0_eight_gba_runtime_verify.py
