name: Phase 1 pinned libretro Qt editor and Go parser emitter partial dossiers
on:
  workflow_call:
permissions:
  contents: read
jobs:
  qt-go-libretro-partial:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify six pinned source blobs, license boundaries, 108 negatives and zero approvals
        run: python3 tools/phase1_remaining_p0_six_qt_go_libretro_verify.py
