name: Phase 1 remaining P0 eight pinned partial source dossiers
on:
  workflow_call:
permissions:
  contents: read
jobs:
  remaining-p0-eight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify eight pinned source blobs and 88 fail-closed negative controls
        run: python3 tools/phase1_remaining_p0_eight_verify.py
