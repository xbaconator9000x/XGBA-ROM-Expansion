name: Phase 1 compiled FireRed classic versus modern ABI
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/firered_variant_semantics.py'
      - 'tools/firered_map_view_variant_semantics.py'
      - 'tools/field_script_stack_lifetime_semantics.py'
      - 'tools/compiled_binding_fingerprints.py'
      - 'tools/firered_full_symbol_census.py'
      - 'tools/phase1_compiled_irq_relocation.py'
      - 'docs/PHASE1_P0_FIRERED_COMPILED_IRQ_COPY_2026-10-26.md'
      - 'tools/firered_compiled_object_bindings.py'
      - 'tools/firered_external_symbol_reconciliation.py'
      - 'tools/firered_runtime_rom_hashes.py'
      - 'tools/runtime_rom_symbol_preflight.py'
      - 'tools/firered_build_timestamp_semantics.py'
      - '.github/workflows/compiled-firered-variants.yml'
permissions:
  contents: read
jobs:
  compare-compiled-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM/Thumb binutils, modern GCC and C runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev build-essential
          command -v arm-none-eabi-gcc
          command -v arm-none-eabi-ld
      - name: Checkout pinned original FireRed and agbcc source
        run: |
          set -euo pipefail
          mkdir -p upstream
          git clone --quiet --filter=blob:none https://github.com/pret/pokefirered.git upstream/pokefirered
          git -C upstream/pokefirered checkout --quiet --detach ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          git clone --quiet --filter=blob:none https://github.com/pret/agbcc.git upstream/agbcc
          git -C upstream/agbcc checkout --quiet --detach da598c1d918402c42c0c0d7128ba14567f3175e9
          test "$(git -C upstream/pokefirered rev-parse HEAD)" = ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          test "$(git -C upstream/agbcc rev-parse HEAD)" = da598c1d918402c42c0c0d7128ba14567f3175e9
      - name: Build and install pinned agbcc
        run: |
          set -o pipefail
          (cd upstream/agbcc && ./build.sh && ./install.sh ../pokefirered) 2>&1 | tee variants-agbcc-build.log
      - name: Compile original legacy agbcc FireRed ELF
        run: |
          set -o pipefail
          make -C upstream/pokefirered -j2 GAME_VERSION=FIRERED MODERN=0 2>&1 | tee variants-classic-build.log
          test -f upstream/pokefirered/pokefirered.elf
      - name: Compile modern GCC FireRed ELF from identical pinned sources
        run: |
          set -o pipefail
          make -C upstream/pokefirered -j2 GAME_VERSION=FIRERED MODERN=1 2>&1 | tee variants-modern-build.log
          test -f upstream/pokefirered/pokefirered_modern.elf
      - name: Compare compiled symbol layout and native script/pokemon table ABI
        run: |
          python3 -m py_compile tools/firered_variant_semantics.py
          python3 tools/firered_variant_semantics.py
      - name: Generate versioned compiled ABI fingerprints and reject 12 mismatched fixtures
        run: |
          python3 -m py_compile tools/compiled_binding_fingerprints.py
          python3 tools/compiled_binding_fingerprints.py
      - name: Compare all original and modern compiled ELF symbols and native regions
        run: |
          python3 -m py_compile tools/firered_full_symbol_census.py
          python3 tools/firered_full_symbol_census.py
      - name: Verify compiled IRQ relocation and copied literal-pool extent
        run: |
          python3 -m py_compile tools/phase1_compiled_irq_relocation.py
          python3 tools/phase1_compiled_irq_relocation.py \
            --source upstream/pokefirered \
            --output firered-variant-evidence/compiled_irq_relocation.json
      - name: Map compiled object source provenance and cross-object symbol edges
        run: |
          python3 -m py_compile tools/firered_compiled_object_bindings.py
          python3 tools/firered_compiled_object_bindings.py
      - name: Reconcile compiler externals with final linked ELF and object relocation evidence
        run: |
          python3 -m py_compile tools/firered_external_symbol_reconciliation.py
          python3 tools/firered_external_symbol_reconciliation.py
      - name: Hash original and modern cartridge bytes separately from ELF symbols and metadata
        run: |
          python3 -m py_compile tools/firered_runtime_rom_hashes.py
          python3 tools/firered_runtime_rom_hashes.py
      - name: Test exact cartridge-and-source symbol adapter preflight with 18 negative and metadata fixtures
        run: |
          python3 -m py_compile tools/runtime_rom_symbol_preflight.py
          python3 tools/runtime_rom_symbol_preflight.py
      - name: Verify real source-compiled BuildDateTime bytes and timestamp-neutralized ROM digest
        run: |
          python3 -m py_compile tools/firered_build_timestamp_semantics.py
          python3 tools/firered_build_timestamp_semantics.py
      - name: Preserve compiler/version semantic differences without ROM binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-phase1-firered-classic-modern-compiled-ABI
          path: |
            firered-variant-evidence/
            variants-agbcc-build.log
            variants-classic-build.log
            variants-modern-build.log
          if-no-files-found: warn
          retention-days: 90
