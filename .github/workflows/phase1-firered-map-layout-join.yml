name: Phase 1 pinned FireRed map-layout authoring join
on:
  pull_request:
    paths:
      - 'tools/phase1_firered_map_layout_join.py'
      - '.github/workflows/phase1-firered-map-layout-join.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-authoring-join:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout XGBA Phase 1 checker
        uses: actions/checkout@v4
      - name: Checkout exact pinned upstream FireRed source
        uses: actions/checkout@v4
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: upstream-firered
          persist-credentials: false
      - name: Validate checker syntax
        run: python3 -m py_compile tools/phase1_firered_map_layout_join.py
      - name: Verify complete authored map-header to layout-table join
        run: |
          python3 tools/phase1_firered_map_layout_join.py \
            --source upstream-firered \
            --output phase1-evidence/firered-map-layout-join.json
      - name: Archive source-pinned join evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-firered-map-layout-join
          path: phase1-evidence/
          if-no-files-found: warn
          retention-days: 30
