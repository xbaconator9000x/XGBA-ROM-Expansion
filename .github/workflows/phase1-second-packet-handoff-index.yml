name: Phase 1 second packet disjoint P0 partial handoff reconciliation
on:
  push:
    branches:
      - phase1/review-readiness-handoff-20261027
  pull_request:
permissions:
  contents: read
jobs:
  second-packet-index:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 28 disjoint P0 partials and 280 negatives
        run: python3 tools/phase1_second_packet_handoff_index_verify.py
