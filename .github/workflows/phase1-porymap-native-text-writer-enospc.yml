name: Phase 1 pinned Porymap native Qt text writer ENOSPC
on:
  push:
    branches:
      - phase1/porymap-full-qt-project-roundtrip-20261028
    paths:
      - '.github/workflows/phase1-porymap-native-text-writer-enospc.yml'
      - 'tools/phase1_porymap_native_text_writer_enospc.py'
      - 'tests/phase1_porymap_native_text_writer.cpp'
      - 'docs/phase1-review-readiness/porymap-native-text-writer-enospc-20261029.md'
  pull_request:
    paths:
      - '.github/workflows/phase1-porymap-native-text-writer-enospc.yml'
      - 'tools/phase1_porymap_native_text_writer_enospc.py'
      - 'tests/phase1_porymap_native_text_writer.cpp'
      - 'docs/phase1-review-readiness/porymap-native-text-writer-enospc-20261029.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-pinned-qt-text-writer-enospc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Clone immutable upstream Porymap source
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/huderlem/porymap.git upstream-porymap
          git -C upstream-porymap checkout --quiet --detach 26b919d7ff4b54152de010abd5bf344af2ebe116
          test "$(git -C upstream-porymap hash-object src/project.cpp)" = d43b0949303433111d4478ad76117c2b3445dd13
      - name: Install existing Qt Core and Linux syscall tracing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev pkg-config g++ strace
      - name: Compile unchanged Project text writer bodies and execute real Qt ENOSPC
        run: |
          set -euo pipefail
          mkdir -p phase1-evidence
          python3 -m py_compile tools/phase1_porymap_native_text_writer_enospc.py
          python3 tools/phase1_porymap_native_text_writer_enospc.py \
            --porymap upstream-porymap \
            --harness tests/phase1_porymap_native_text_writer.cpp \
            --output phase1-evidence/native-text-writer.json \
            --log phase1-evidence/native-text-writer.log \
            --trace phase1-evidence/native-text-writer-strace.log
      - name: Archive text-only partial semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-porymap-native-text-writer-enospc-text
          path: |
            phase1-evidence/*.json
            phase1-evidence/*.log
          if-no-files-found: warn
          retention-days: 30
