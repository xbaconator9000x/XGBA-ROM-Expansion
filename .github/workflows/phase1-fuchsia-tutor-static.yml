name: Phase 1 pinned FireRed Fuchsia tutor static include closure
on:
  workflow_call:
permissions:
  contents: read
jobs:
  fuchsia-tutor-static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned source include closure and 24 fail-closed negatives
        run: python3 tools/phase1_fuchsia_tutor_include_verify.py
