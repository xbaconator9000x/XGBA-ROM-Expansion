name: Phase 1 pinned Trainer Tower lobby script to stock FALSE stub
on:
  push:
    branches: [phase1/tower-prefix-integrity-20261027]
    paths:
      - 'tools/phase1_tower_stock_script_reachability.py'
      - 'docs/phase1-review-readiness/tower-stock-script-reachability-20261029.md'
      - '.github/workflows/phase1-tower-stock-script-reachability.yml'
  pull_request:
    paths:
      - 'tools/phase1_tower_stock_script_reachability.py'
      - 'docs/phase1-review-readiness/tower-stock-script-reachability-20261029.md'
      - '.github/workflows/phase1-tower-stock-script-reachability.yml'
permissions:
  contents: read
jobs:
  source-lobby-to-original-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: upstream-firered
          persist-credentials: false
      - name: Verify original stock lobby script dependency and fail-closed negatives
        run: |
          set -euo pipefail
          python3 tools/phase1_tower_stock_script_reachability.py --firered upstream-firered --output phase1-evidence/tower-stock-script-reachability.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-tower-stock-script-reachability
          path: phase1-evidence/tower-stock-script-reachability.json
          if-no-files-found: warn
