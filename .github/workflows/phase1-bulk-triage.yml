name: Phase 1 pinned bulk machine triage (no approvals)
on:
  push:
    branches: ["phase1/**"]
    paths:
      - "tools/phase1_bulk_triage.py"
      - "tests/test_phase1_bulk_triage.py"
      - ".github/workflows/phase1-bulk-triage.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: phase1-bulk-triage
  cancel-in-progress: false
jobs:
  pinned-bulk-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed negative controls
        run: python3 -m unittest discover -s tests -p test_phase1_bulk_triage.py -v
      - name: Fetch pinned Git trees without checking out all upstream blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xgba-pins"
          while read -r repo sha; do
            target="$RUNNER_TEMP/xgba-pins/$(basename "$repo")"
            git init -q "$target"
            git -C "$target" remote add origin "https://github.com/$repo.git"
            git -C "$target" -c protocol.version=2 fetch -q --filter=blob:none --depth=1 origin "$sha"
            git -C "$target" config remote.origin.promisor true
            git -C "$target" config remote.origin.partialclonefilter blob:none
            git -C "$target" update-ref refs/heads/triage-pin "$sha"
            git -C "$target" symbolic-ref HEAD refs/heads/triage-pin
            test "$(git -C "$target" rev-parse HEAD)" = "$sha"
          done <<'PINS'
          pret/pokefirered ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          mgba-emu/mgba fd9dc5c2cbf234365068855851107e762fc6211b
          huderlem/porymap 26b919d7ff4b54152de010abd5bf344af2ebe116
          huderlem/poryscript c32481161c767b25a3425fa9f1f8729927ff3d55
          pret/agbcc da598c1d918402c42c0c0d7128ba14567f3175e9
          PINS
      - name: Generate 300 exact-blob-verified structural machine-triage records
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/phase1_bulk_triage.py --source-root "$RUNNER_TEMP/xgba-pins" --limit 300 --offset 200 --output docs/phase1-machine-triage/batch-000200-000499.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/phase1-machine-triage/batch-000200-000499.json').read_text())
          assert d['selected_count']==300 and d['source_reverified']
          assert len({(r['identity']['repository'],r['identity']['path']) for r in d['records']})==300
          assert all(r['state']=='MACHINE_TRIAGED_NEEDS_WHOLE_FILE_SEMANTIC_REVIEW' and not r['independent_approval'] and not r['prepared_whole_file_candidate'] and r['whole_file_structure'] for r in d['records'])
          print('BULK_TRIAGE_PASS 300 exact pinned blobs; 0 approvals; prepared count unchanged')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-machine-triage-300
          path: docs/phase1-machine-triage/batch-000200-000499.json
          retention-days: 90
      - name: Commit verified machine-only checkpoint without force or rerun
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/phase1-machine-triage/batch-000200-000499.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Checkpoint 300 additional pinned Phase 1 machine-triage records (no approvals)'
          git push origin "HEAD:$GITHUB_REF_NAME"
