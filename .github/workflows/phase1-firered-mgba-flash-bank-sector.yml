name: Phase 1 pinned FireRed mGBA Flash bank-sector compiled boundary
on:
  push:
    branches:
      - phase1/firered-mgba-flash-bank-sector-20261027
  pull_request:
    paths:
      - 'tools/phase1_firered_mgba_flash_bank_sector.py'
      - 'tests/phase1_firered_mgba_flash_bank_sector.c'
      - 'docs/phase1-review-readiness/firered-mgba-flash-bank-sector-20261027.md'
      - '.github/workflows/phase1-firered-mgba-flash-bank-sector.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-flash-bank-sector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python syntax and source identity
        run: python -m py_compile tools/phase1_firered_mgba_flash_bank_sector.py
      - name: Compile five exact pinned source functions and run 32-sector negative/positive matrix
        run: |
          set -euo pipefail
          python tools/phase1_firered_mgba_flash_bank_sector.py --output phase1-evidence/firered-mgba-flash-bank-sector.json
          python -m json.tool phase1-evidence/firered-mgba-flash-bank-sector.json > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-firered-mgba-flash-bank-sector
          path: phase1-evidence/firered-mgba-flash-bank-sector.json
          if-no-files-found: warn
          retention-days: 90
