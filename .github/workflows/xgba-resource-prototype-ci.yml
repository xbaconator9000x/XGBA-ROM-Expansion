name: XGBA opt-in resource prototype CI
on:
  pull_request:
    paths:
      - 'tools/xgba_resource_*.py'
      - 'tools/xgba_resource_*.c'
      - 'tests/test_xgba_resource_*.py'
      - 'docs/XGBA_FIRERED_INTEGRATION_PRIORITY_20261110.md'
      - 'docs/XGBA_RESOURCE_PROTOTYPE_REUSE_20261110.md'
      - '.github/workflows/xgba-resource-prototype-ci.yml'
  push:
    branches:
      - 'phase1/xgba-optin-resource-prototype-20261110'
    paths:
      - 'tools/xgba_resource_*.py'
      - 'tools/xgba_resource_*.c'
      - 'tests/test_xgba_resource_*.py'
      - 'docs/XGBA_FIRERED_INTEGRATION_PRIORITY_20261110.md'
      - 'docs/XGBA_RESOURCE_PROTOTYPE_REUSE_20261110.md'
      - '.github/workflows/xgba-resource-prototype-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgba-resource-prototype-${{ github.ref }}
  cancel-in-progress: false
jobs:
  product-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Source and deterministic behavioral tests (never semantic approval)
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/XGBA_RESOURCE_PROTOTYPE_REUSE_20261110.md
          shopt -s nullglob
          source_files=(tools/xgba_resource_*.py)
          test_files=(tests/test_xgba_resource_*.py)
          if (("${#source_files[@]}" == 0 || "${#test_files[@]}" == 0)); then
            echo "PENDING_IMPLEMENTATION: no product code/test bundle yet (not a PASS for any workpack)"
            exit 0
          fi
          for file in "${source_files[@]}" "${test_files[@]}"; do
            python3 -m py_compile "$file"
          done
          # Real upstream sources only when a native integration task exists.
          if [[ -f tests/test_xgba_resource_firered_adapter.py || -f tests/test_xgba_resource_integration_smoke.py ]]; then
            mkdir -p upstream
            git clone --quiet --filter=blob:none https://github.com/pret/pokefirered.git upstream/pokefirered
            git -C upstream/pokefirered checkout --quiet --detach ce6406d8c2eaf46d543c8a2606de0c3cb1951982
            test "$(git -C upstream/pokefirered rev-parse HEAD)" = ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          fi
          if [[ -f tests/test_xgba_resource_mgba_adapter.py || -f tests/test_xgba_resource_integration_smoke.py ]]; then
            mkdir -p upstream
            git clone --quiet --filter=blob:none https://github.com/mgba-emu/mgba.git upstream/mgba
            git -C upstream/mgba checkout --quiet --detach fd9dc5c2cbf234365068855851107e762fc6211b
            test "$(git -C upstream/mgba rev-parse HEAD)" = fd9dc5c2cbf234365068855851107e762fc6211b
          fi
          # R6 needs a real ARM7TDMI toolchain and native build utilities.
          # Do not skip R6 if package installation fails.
          if [[ -f tests/test_xgba_resource_integration_smoke.py ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
              libpng-dev build-essential cmake
            command -v arm-none-eabi-gcc
            command -v arm-none-eabi-nm
          fi
          # Actual tests must compile and exercise the pinned integration, never mock
          # missing upstream or skip a missing toolchain and then claim success.
          python3 -m unittest discover -s tests -p 'test_xgba_resource_*.py' -v 2>&1 | tee "${RUNNER_TEMP}/xgba-product-tests.log"
          if grep -Eq 'skipped=|expected failures=' "${RUNNER_TEMP}/xgba-product-tests.log"; then
            echo 'FAIL: an integration test was skipped or expected to fail'
            exit 1
          fi
          echo "Product tests PASS. No independent semantic approval inferred."
