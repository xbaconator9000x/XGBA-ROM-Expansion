name: XGBA R21 original Emerald malloc fragmentation and battle reentry
on:
  push:
    branches:
      - 'phase2/r21-emerald-heap-pressure-20261111'
    paths:
      - 'integration/emerald/xgba_r21_heap_pressure.inc'
      - 'integration/emerald/xgba_r19_connected_maps.inc'
      - 'integration/emerald/xgba_r19_battle_assets.inc'
      - 'integration/emerald/xgba_r17_external_littleroot.inc'
      - 'integration/mgba/xgba_r19_mixed_battle.h'
      - 'integration/mgba/xgba_mgba_headless.c'
      - 'tools/xgba_r17_emerald_heap.py'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tools/xgba_mgba_run.py'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - 'tools/xgba_r17_emerald_heap.py'
      - 'tests/test_xgba_r19_mixed_battle.py'
      - 'tests/test_xgba_r21_emerald_heap_pressure.py'
      - '.github/workflows/xgba-r21-emerald-heap-pressure.yml'
  pull_request:
    paths:
      - 'integration/emerald/xgba_r19_battle_assets.inc'
      - 'integration/mgba/xgba_r19_mixed_battle.h'
      - 'integration/mgba/xgba_mgba_headless.c'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tests/test_xgba_r21_emerald_heap_pressure.py'
      - 'tests/test_xgba_r21_emerald_heap_pressure.py'
      - '.github/workflows/xgba-r21-emerald-heap-pressure.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgba-r21-heap-pressure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-original-emerald-malloc-fragmentation-battle-reentry:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install exact original Emerald and mGBA source build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev build-essential cmake python3-pil
      - name: Checkout immutable Emerald game and original mGBA core pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          git clone --quiet --filter=blob:none https://github.com/pret/pokeemerald.git upstream/pokeemerald
          git -C upstream/pokeemerald checkout --quiet --detach 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          git clone --quiet --filter=blob:none https://github.com/mgba-emu/mgba.git upstream/mgba
          git -C upstream/mgba checkout --quiet --detach fd9dc5c2cbf234365068855851107e762fc6211b
          test "$(git -C upstream/pokeemerald rev-parse HEAD)" = 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          test "$(git -C upstream/mgba rev-parse HEAD)" = fd9dc5c2cbf234365068855851107e762fc6211b
      - name: Execute original Emerald malloc pressure, field recovery and two native double battles
        shell: bash
        env:
          XGBA_R21_EVIDENCE_DIR: ${{ github.workspace }}/r21-heap-evidence
        run: |
          set -euo pipefail
          python3 -m py_compile tests/test_xgba_r21_emerald_heap_pressure.py
          python3 -m unittest discover -s tests -p 'test_xgba_r20_ewram_reentry.py' -v 2>&1 | tee xgba-r21-heap.log
          grep -q 'Ran 10 tests' xgba-r21-heap.log
          grep -q '^OK$' xgba-r21-heap.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('r21-heap-evidence')
          shots=sorted(root.glob('*.png'))
          assert len(shots)==4,shots
          for shot in shots:
              with Image.open(shot) as im:assert im.size==(240,160)
          report=json.loads((root/'proof.json').read_text())
          assert report["original_engine_battle_count"] == 2
          assert report["expected_external_sprite_fetches"] == 4
          assert report["map_reacquisition_between_battles"]
          assert report["original_native_memblock_allocator_exercised"]
          assert report["guest_alloc_pressure_cycles"] == 2
          assert report["guest_guard_pattern_bytes_verified"] == 12288
          assert not list(root.glob('*.gba')) and not list(root.glob('*.sav'))
          print('PASS_R21_NATIVE_EMERALD_HEAP_PRESSURE_10_TESTS')
          PY
      - name: Publish genuine native LCD evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-r21-original-emerald-heap-pressure
          path: r21-heap-evidence/
          retention-days: 90
          if-no-files-found: warn
