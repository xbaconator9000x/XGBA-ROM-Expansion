name: XGBA Copilot continuous coding queue
on:
  push:
    branches: [integration/expansion-frameworks-20261115]
    paths:
      - '.github/workflows/xgba-copilot-worker.yml'
      - '.github/xgba-coding-state.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: xgba-pr126-coding-worker
  cancel-in-progress: false

jobs:
  select:
    if: github.repository == 'xbaconator9000x/XGBA-ROM-Expansion' && github.ref == 'refs/heads/integration/expansion-frameworks-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    outputs:
      proceed: ${{ steps.select.outputs.proceed }}
      stage: ${{ steps.select.outputs.stage }}
      attempt: ${{ steps.select.outputs.attempt }}
      total: ${{ steps.select.outputs.total }}
      prompt: ${{ steps.select.outputs.prompt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight publishing permissions and await exact-head CI
        id: select
        env:
          GH_TOKEN: ${{ secrets.XGBA_COPILOT_DISPATCH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --dry-run origin HEAD:refs/heads/integration/expansion-frameworks-20261115
          python3 tools/xgba_copilot_queue.py select
  code:
    needs: select
    if: needs.select.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tested coding CLI and source test dependencies
        run: |
          npm install -g @github/copilot@1.0.114
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Prepare pinned original engine source reference for coding agent
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch expansion/1.17.2 https://github.com/rh-hideout/pokeemerald-expansion.git "$RUNNER_TEMP/rhh-checkout"
          test "$(git -C "$RUNNER_TEMP/rhh-checkout" rev-parse HEAD)" = 79dd436920845ebc145577649de624f65298c209
          mkdir "$RUNNER_TEMP/rhh-reference"
          git -C "$RUNNER_TEMP/rhh-checkout" archive HEAD src include | tar -x -C "$RUNNER_TEMP/rhh-reference"
          git -C "$RUNNER_TEMP/rhh-checkout" ls-tree -r --name-only HEAD > "$RUNNER_TEMP/rhh-reference/SOURCE_PATHS.txt"
          chmod -R a-w "$RUNNER_TEMP/rhh-reference"
      - name: Implement queued task and repair local test failure once
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.XGBA_COPILOT_AGENT_PAT }}
          COPILOT_AUTO_UPDATE: 'false'
          TASK_B64: ${{ needs.select.outputs.prompt }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COPILOT_GITHUB_TOKEN"
          prompt=$(printf '%s' "$TASK_B64" | base64 -d)
          prompt="$prompt

          Pinned RHH original engine reference (read only): $RUNNER_TEMP/rhh-reference. Read the actual upstream functions and headers there; SOURCE_PATHS.txt gives original resource paths."
          copilot --version
          for attempt in 1 2; do
            copilot -p "$prompt" --no-ask-user --add-dir="$RUNNER_TEMP/rhh-reference" --deny-tool="write($RUNNER_TEMP/rhh-reference)" --allow-tool='read,write,shell(git diff:*),shell(git status:*),shell(git log:*),shell(git show:*),shell(ls:*),shell(cat:*),shell(grep:*),shell(rg:*),shell(find:*)'
            env -u COPILOT_GITHUB_TOKEN python3 tools/xgba_copilot_queue.py validate
            if (env -u COPILOT_GITHUB_TOKEN python3 -m compileall -q tools tests && env -u COPILOT_GITHUB_TOKEN python3 -m unittest discover -s tests -p 'test_xgba_expansion_*.py' -v) > "$RUNNER_TEMP/queue-tests.log" 2>&1; then
              cat "$RUNNER_TEMP/queue-tests.log"
              exit 0
            fi
            cat "$RUNNER_TEMP/queue-tests.log"
            if [ "$attempt" = 2 ]; then exit 1; fi
            git reset --mixed HEAD
            prompt="$prompt

          Repair this local test failure without weakening assertions. Diagnostics only:
          $(tail -c 12000 "$RUNNER_TEMP/queue-tests.log")"
          done
      - name: Preserve validated source patch
        run: |
          python3 tools/xgba_copilot_queue.py validate
          git diff --cached --no-ext-diff > "$RUNNER_TEMP/xgba-validated-source.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: xgba-validated-source-patch
          path: ${{ runner.temp }}/xgba-validated-source.patch
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: [select, code]
    if: needs.select.outputs.proceed == 'true' && needs.code.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xgba-validated-source-patch
          path: ${{ runner.temp }}
      - name: Validate clean-runner source patch and queue transition
        env:
          STAGE: ${{ needs.select.outputs.stage }}
          ATTEMPT: ${{ needs.select.outputs.attempt }}
          TOTAL: ${{ needs.select.outputs.total }}
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/xgba-validated-source.patch"
          git apply "$RUNNER_TEMP/xgba-validated-source.patch"
          python3 tools/xgba_copilot_queue.py validate
          python3 tools/xgba_copilot_queue.py advance "$STAGE" "$ATTEMPT" "$TOTAL"
          git add .github/xgba-coding-state.json
          git diff --cached --check
      - name: Publish candidate and trigger next exact-head gate
        env:
          GH_TOKEN: ${{ secrets.XGBA_COPILOT_DISPATCH_PAT }}
          STAGE: ${{ needs.select.outputs.stage }}
          ATTEMPT: ${{ needs.select.outputs.attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/xgba_copilot_queue.py check-head
          git config user.name 'XGBA coding worker'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m "XGBA queue stage $((STAGE+1)) candidate $ATTEMPT"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/integration/expansion-frameworks-20261115
          git rev-parse HEAD
