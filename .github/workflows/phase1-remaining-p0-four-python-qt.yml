name: Phase 1 pinned mGBA Python and Qt source handoff
on:
  push:
    branches:
      - phase1/review-readiness-handoff-20261027
  pull_request:
permissions:
  contents: read
jobs:
  python-qt-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify four pinned Python/Qt source dossiers and fail-closed negatives
        run: python3 tools/phase1_remaining_p0_four_python_qt_verify.py
