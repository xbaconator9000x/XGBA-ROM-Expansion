name: XGBA R19 Emerald connected native external maps
on:
  push:
    branches:
      - 'phase2/r19-emerald-connected-maps-mixed-battle-20261111'
    paths:
      - 'integration/emerald/xgba_r19_connected_maps.inc'
      - 'integration/emerald/xgba_r17_external_littleroot.inc'
      - 'integration/mgba/xgba_r19_connected_maps.h'
      - 'integration/mgba/xgba_mgba_headless.c'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tools/xgba_mgba_run.py'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - 'tests/test_xgba_r19_connected_maps.py'
      - '.github/workflows/xgba-r19-emerald-connected-maps.yml'
  pull_request:
    paths:
      - 'integration/emerald/xgba_r19_connected_maps.inc'
      - 'integration/mgba/xgba_r19_connected_maps.h'
      - 'integration/mgba/xgba_mgba_headless.c'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tests/test_xgba_r19_connected_maps.py'
      - '.github/workflows/xgba-r19-emerald-connected-maps.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgba-r19-native-maps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-two-connected-emerald-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install actual Emerald and native mGBA build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev build-essential cmake python3-pil
      - name: Retrieve exact pinned game decomp and emulator sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          git clone --quiet --filter=blob:none https://github.com/pret/pokeemerald.git upstream/pokeemerald
          git -C upstream/pokeemerald checkout --quiet --detach 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          git clone --quiet --filter=blob:none https://github.com/mgba-emu/mgba.git upstream/mgba
          git -C upstream/mgba checkout --quiet --detach fd9dc5c2cbf234365068855851107e762fc6211b
          test "$(git -C upstream/pokeemerald rev-parse HEAD)" = 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          test "$(git -C upstream/mgba rev-parse HEAD)" = fd9dc5c2cbf234365068855851107e762fc6211b
      - name: Build source-backed game and verify both map crossings and native graphics
        shell: bash
        env:
          XGBA_R19_EVIDENCE_DIR: ${{ github.workspace }}/r19-map-evidence
        run: |
          set -euo pipefail
          python3 -m py_compile tests/test_xgba_r19_connected_maps.py tests/test_xgba_r17_emerald_external_map.py
          python3 -m unittest discover -s tests -p 'test_xgba_r19_connected_maps.py' -v 2>&1 | tee xgba-r19-map.log
          grep -q 'Ran 6 tests' xgba-r19-map.log
          grep -q '^OK$' xgba-r19-map.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('r19-map-evidence')
          photos=sorted(root.glob('*.png'))
          assert len(photos)==3,photos
          for photo in photos:
              with Image.open(photo) as im:assert im.size==(240,160)
          report=json.loads((root/'proof.json').read_text())
          assert report['real_gba_camera_connected_transition']
          assert report['real_native_ewram_and_bg_vram_verified']
          assert report['disabled_fail_closed_no_provider_reads']
          assert not list(root.glob('*.gba')) and not list(root.glob('*.sav'))
          print('PASS_R19_EMERALD_CONNECTED_NATIVE_MAPS_6_TESTS')
          PY
      - name: Preserve only native Emerald LCD screenshots and evidence metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-r19-real-emerald-connected-maps
          path: r19-map-evidence/
          retention-days: 90
          if-no-files-found: error
