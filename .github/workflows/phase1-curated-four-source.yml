name: Phase 1 curated four additional pinned source analyst evidence
on:
  push:
    branches:
      - phase1/review-readiness-handoff-20261027
    paths:
      - 'tools/phase1_curated_four_source_verify.py'
      - 'tools/phase1_curated_six_source_verify.py'
      - 'docs/phase1-review-readiness/curated-four-source-dossiers-20261029.json'
      - '.github/workflows/phase1-curated-four-source.yml'
  pull_request:
    paths:
      - 'tools/phase1_curated_four_source_verify.py'
      - 'tools/phase1_curated_six_source_verify.py'
      - 'docs/phase1-review-readiness/curated-four-source-dossiers-20261029.json'
      - '.github/workflows/phase1-curated-four-source.yml'
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify four exact pinned blobs and reject eight mutations
        run: python3 tools/phase1_curated_four_source_verify.py
