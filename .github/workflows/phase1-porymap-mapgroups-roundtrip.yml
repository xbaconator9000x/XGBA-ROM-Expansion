name: Phase 1 Porymap map-group metadata round-trip witness
on:
  pull_request:
    paths:
      - 'tools/phase1_porymap_mapgroups_roundtrip.py'
      - '.github/workflows/phase1-porymap-mapgroups-roundtrip.yml'
      - 'docs/PHASE1_P0_PORYMAP_FIRERED_MAP_GROUPS_METADATA_ROUNDTRIP_2026-10-27.md'
  workflow_dispatch:
  push:
    paths:
      - 'tools/phase1_porymap_mapgroups_roundtrip.py'
      - '.github/workflows/phase1-porymap-mapgroups-roundtrip.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify witness syntax
        run: python3 -m py_compile tools/phase1_porymap_mapgroups_roundtrip.py
      - name: Checkout immutable Porymap and FireRed source
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/huderlem/porymap.git upstream/porymap
          git -C upstream/porymap fetch --quiet origin 26b919d7ff4b54152de010abd5bf344af2ebe116
          git -C upstream/porymap checkout --quiet --detach 26b919d7ff4b54152de010abd5bf344af2ebe116
          git clone --quiet --filter=blob:none https://github.com/pret/pokefirered.git upstream/pokefirered
          git -C upstream/pokefirered fetch --quiet origin ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          git -C upstream/pokefirered checkout --quiet --detach ce6406d8c2eaf46d543c8a2606de0c3cb1951982
      - name: Verify source contract and fail-closed mutation controls
        run: |
          python3 tools/phase1_porymap_mapgroups_roundtrip.py \
            --porymap upstream/porymap \
            --firered upstream/pokefirered \
            --out audit-output/porymap_mapgroups_roundtrip.json
      - name: Preserve source-grounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-phase1-porymap-mapgroups-roundtrip
          path: audit-output/porymap_mapgroups_roundtrip.json
          retention-days: 90
          if-no-files-found: warn
