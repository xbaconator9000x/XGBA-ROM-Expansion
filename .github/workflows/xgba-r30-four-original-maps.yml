name: XGBA R30 genuine Emerald four-map source streaming
on:
  push:
    branches: [main, 'phase3/r30-fourth-real-emerald-map-20261112']
    paths:
      - 'integration/common/xgba_map_cache.h'
      - 'integration/mgba/xgba_r30_four_maps.h'
      - 'integration/mgba/xgba_mgba_headless.c'
      - 'tools/xgba_mgba_run.py'
      - 'tests/test_xgba_r30_emerald_four_maps.py'
      - 'integration/emerald/xgba_r19_connected_maps.inc'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - 'tests/test_xgba_r28_map_cache.c'
      - 'tests/test_xgba_r30_emerald_four_maps.py'
      - '.github/workflows/xgba-r28-three-map-cache.yml'
  pull_request:
    branches: [main]
    paths:
      - 'integration/common/xgba_map_cache.h'
      - 'integration/mgba/xgba_r30_four_maps.h'
      - 'integration/mgba/xgba_mgba_headless.c'
      - 'tools/xgba_mgba_run.py'
      - 'tests/test_xgba_r30_emerald_four_maps.py'
      - 'integration/emerald/xgba_r19_connected_maps.inc'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - 'tests/test_xgba_r28_map_cache.c'
      - 'tests/test_xgba_r30_emerald_four_maps.py'
      - '.github/workflows/xgba-r28-three-map-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgba-r30-cache-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-c-cache-lifetime:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute actual production cache header in strict C
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -o /tmp/xgba-r28-map-cache-tests tests/test_xgba_r28_map_cache.c
          /tmp/xgba-r28-map-cache-tests 2>&1 | tee /tmp/xgba-r28-cache.log
          grep -q 'PASS_R28_PORTABLE_CACHE_CONTRACT 16/16' /tmp/xgba-r28-cache.log
          echo 'PASS_R28_PORTABLE_ONLY not_an_original_game_native_result=1'
  original-emerald-four-connected-maps:
    name: Original Emerald native four-map eviction, D-pad and seven LCD frames
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install original Emerald toolchain and mGBA native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev build-essential cmake python3-pil
      - name: Checkout exact original game and emulator source pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          git clone --quiet --filter=blob:none https://github.com/pret/pokeemerald.git upstream/pokeemerald
          git -C upstream/pokeemerald checkout --quiet --detach 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          git clone --quiet --filter=blob:none https://github.com/mgba-emu/mgba.git upstream/mgba
          git -C upstream/mgba checkout --quiet --detach fd9dc5c2cbf234365068855851107e762fc6211b
          test "$(git -C upstream/pokeemerald rev-parse HEAD)" = 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          test "$(git -C upstream/mgba rev-parse HEAD)" = fd9dc5c2cbf234365068855851107e762fc6211b
      - name: Execute original Emerald 9-16-10-17-10-16-9 through genuine D-pad
        shell: bash
        env:
          XGBA_R30_EVIDENCE_DIR: ${{ github.workspace }}/r30-evidence
        run: |
          set -euo pipefail
          python3 -m py_compile tools/xgba_mgba_run.py tests/test_xgba_r17_emerald_external_map.py tests/test_xgba_r30_emerald_four_maps.py
          PYTHONPATH=tools:tests:integration/mgba python3 -m unittest test_xgba_r30_emerald_four_maps.RealEmeraldFourExternalMaps -v 2>&1 | tee r30-native.log
          grep -q 'Ran 9 tests' r30-native.log
          grep -q '^OK$' r30-native.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          r=Path("r30-evidence")
          proof=json.loads((r/"proof.json").read_text())
          assert proof["source_map_sequence"]==[9,16,10,17,10,16,9]
          assert proof["logical_resource_count"]==4
          assert proof["simultaneous_physical_map_slots"]==2
          assert proof["actual_guest_ewram_reservation_bytes"]==16384
          assert "PASS_R30_REAL_EMERALD_FOUR_MAP_EVICTION" in proof["native_c_log"]
          assert "PASS_R30_DISABLED_ORIGINAL_EMERALD_ZERO_PROVIDER_READS" in proof["disabled_log"]
          images=sorted(r.glob("*.png"))
          assert len(images)==7, images
          for path in images:
              with Image.open(path) as img:
                  assert img.size==(240,160)
          assert not list(r.glob("*.gba")) and not list(r.glob("*.sav"))
          print("PASS_R30_NATIVE_ORIGINAL_EMERALD 9/9 7_LCD four_maps_two_slots")
          PY
      - name: Preserve original mGBA LCD frames and machine-checkable native proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-r30-original-emerald-four-connected-maps
          path: |
            r30-evidence/
            r30-native.log
          retention-days: 90
          if-no-files-found: warn
