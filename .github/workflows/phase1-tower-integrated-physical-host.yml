name: Phase 1 pinned Trainer Tower integrated special-sector host C
on:
  push:
    branches:
      - phase1/tower-prefix-integrity-20261027
    paths:
      - '.github/workflows/phase1-tower-integrated-physical-host.yml'
      - 'tools/phase1_tower_integrated_physical_host.py'
      - 'tests/phase1_tower_integrated_physical_host.c'
      - 'docs/phase1-review-readiness/trainer-tower-integrated-physical-host-20261029.md'
  pull_request:
    paths:
      - '.github/workflows/phase1-tower-integrated-physical-host.yml'
      - 'tools/phase1_tower_integrated_physical_host.py'
      - 'tests/phase1_tower_integrated_physical_host.c'
      - 'docs/phase1-review-readiness/trainer-tower-integrated-physical-host-20261029.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-pinned-integrated-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: pinned-firered
          persist-credentials: false
      - name: Execute original paired CEReader and physical-sector C wrappers
        run: |
          set -euo pipefail
          mkdir -p phase1-evidence
          python3 -m py_compile tools/phase1_tower_integrated_physical_host.py
          python3 tools/phase1_tower_integrated_physical_host.py \
            --source pinned-firered \
            --harness tests/phase1_tower_integrated_physical_host.c \
            --output phase1-evidence/tower-integrated-physical-host.json \
            --log phase1-evidence/tower-integrated-physical-host.txt
          python3 -m json.tool phase1-evidence/tower-integrated-physical-host.json >/dev/null
      - name: Archive text-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-tower-integrated-physical-host-text
          path: phase1-evidence/
          if-no-files-found: warn
          retention-days: 45
