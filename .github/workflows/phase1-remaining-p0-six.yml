name: Phase 1 remaining P0 six pinned source partial dossiers
on:
  workflow_call:
permissions:
  contents: read
jobs:
  remaining-p0-six:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify six remaining P0 source identities and 48 negatives
        run: python3 tools/phase1_remaining_p0_six_verify.py
