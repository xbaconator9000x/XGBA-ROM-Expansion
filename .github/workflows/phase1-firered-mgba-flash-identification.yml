name: Phase 1 FireRed mGBA Flash identification contract (no approvals)
on:
  push:
    branches:
      - phase1/firered-mgba-flash-identification-contract-20261027
  pull_request:
    paths:
      - 'tools/phase1_firered_mgba_flash_contract.py'
      - 'docs/phase1-review-readiness/firered-mgba-flash-identification-contract-20261027.md'
      - '.github/workflows/phase1-firered-mgba-flash-identification.yml'
      - 'tools/phase1_mgba_override_compiled_branch_matrix.py'
      - 'tools/phase1_mgba_flash_id_compiled_reader.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-cross-repo-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 11 pinned blobs, cross-repo source contract and negative controls
        run: python tools/phase1_firered_mgba_flash_contract.py
      - name: Compile actual pinned mGBA override function with 12 branch cases
        run: python tools/phase1_mgba_override_compiled_branch_matrix.py --output phase1-evidence/mgba-override-compiled.json
      - name: Compile pinned Flash ID reader with 11 bank/timing cases
        run: python tools/phase1_mgba_flash_id_compiled_reader.py --output phase1-evidence/mgba-flash-id-compiled.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mgba-override-compiled-evidence
          path: |
            phase1-evidence/mgba-override-compiled.json
            phase1-evidence/mgba-flash-id-compiled.json
          if-no-files-found: warn
