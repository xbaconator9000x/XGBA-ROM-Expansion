name: Phase 1 remaining P0 Porymap event connection partial dossiers
on:
  workflow_call:
permissions:
  contents: read
jobs:
  porymap-partial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify eight exact pinned Porymap sources and 112 fail-closed controls
        run: python3 tools/phase1_remaining_p0_eight_porymap_verify.py
