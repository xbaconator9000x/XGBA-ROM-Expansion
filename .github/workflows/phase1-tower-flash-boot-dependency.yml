name: Phase 1 original FireRed special-sector Flash boot dependency
on:
  push:
    branches: [phase1/tower-prefix-integrity-20261027]
    paths:
      - 'tools/phase1_tower_flash_boot_dependency.py'
      - 'docs/phase1-review-readiness/tower-flash-boot-closure-20261029.md'
      - '.github/workflows/phase1-tower-flash-boot-dependency.yml'
  pull_request:
    paths:
      - 'tools/phase1_tower_flash_boot_dependency.py'
      - 'docs/phase1-review-readiness/tower-flash-boot-closure-20261029.md'
      - '.github/workflows/phase1-tower-flash-boot-dependency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: upstream-firered
          persist-credentials: false
      - name: Verify pinned six-file boot/Flash call closure and source negatives
        run: |
          set -euo pipefail
          python3 -m py_compile tools/phase1_tower_flash_boot_dependency.py
          python3 tools/phase1_tower_flash_boot_dependency.py --firered upstream-firered --output phase1-evidence/tower-flash-boot-closure.json
      - name: Preserve source-only text evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-tower-flash-boot-dependency
          path: phase1-evidence/*.json
          if-no-files-found: warn
