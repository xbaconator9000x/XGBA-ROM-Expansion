name: XGBA R68 authentic Fly source resource closure
on:
  push:
    branches: ['integration/r51-original-three-world-grid-native-20261113']
    paths:
      - 'tools/xgba_r68_fly_resource_closure.py'
      - 'tests/test_xgba_r68_fly_resource_closure.py'
      - '.github/workflows/xgba-r68-original-fly-resource-closure.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-safe-fly-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Source-scoped original NPC and tileset closure without private ROM bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/xgba_r68_fly_resource_closure.py \
            tests/test_xgba_r68_fly_resource_closure.py
          PYTHONPATH=tools:tests python3 -m unittest \
            test_xgba_r68_fly_resource_closure -v
          ! git ls-files | grep -Eiq '\.(gba|nds|sav|ips|bps)$'
