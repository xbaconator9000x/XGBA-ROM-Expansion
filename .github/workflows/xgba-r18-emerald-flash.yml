name: XGBA R18 genuine Emerald Flash save and native cold continue
on:
  push:
    branches:
      - 'phase2/r18-emerald-original-flash-cold-continue-20261111'
    paths:
      - 'integration/emerald/xgba_r18_save.inc'
      - 'integration/emerald/xgba_r17_external_littleroot.inc'
      - 'integration/mgba/xgba_r18_emerald_flash.h'
      - 'integration/mgba/xgba_mgba_headless.c'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tools/xgba_mgba_run.py'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - 'tests/test_xgba_r18_emerald_flash.py'
      - '.github/workflows/xgba-r18-emerald-flash.yml'
  pull_request:
    paths:
      - 'integration/emerald/xgba_r18_save.inc'
      - 'integration/emerald/xgba_r17_external_littleroot.inc'
      - 'integration/mgba/xgba_r18_emerald_flash.h'
      - 'integration/mgba/xgba_mgba_headless.c'
      - 'tools/xgba_r17_emerald_patch.py'
      - 'tools/xgba_mgba_run.py'
      - 'tests/test_xgba_r17_emerald_external_map.py'
      - 'tests/test_xgba_r18_emerald_flash.py'
      - '.github/workflows/xgba-r18-emerald-flash.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgba-r18-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-emerald-original-flash-and-cold-continue:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install exact decomp and native emulator test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev build-essential cmake python3-pil
      - name: Fetch pinned original Emerald and unchanged native mGBA provider
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          git clone --quiet --filter=blob:none https://github.com/pret/pokeemerald.git upstream/pokeemerald
          git -C upstream/pokeemerald checkout --quiet --detach 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          git clone --quiet --filter=blob:none https://github.com/mgba-emu/mgba.git upstream/mgba
          git -C upstream/mgba checkout --quiet --detach fd9dc5c2cbf234365068855851107e762fc6211b
          test "$(git -C upstream/pokeemerald rev-parse HEAD)" = 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          test "$(git -C upstream/mgba rev-parse HEAD)" = fd9dc5c2cbf234365068855851107e762fc6211b
      - name: Execute three independent real native emulator processes and original Emerald Flash
        shell: bash
        env:
          XGBA_R18_EVIDENCE_DIR: ${{ github.workspace }}/r18-evidence
        run: |
          set -euo pipefail
          python3 -m py_compile tools/xgba_r17_emerald_patch.py tests/test_xgba_r17_emerald_external_map.py tests/test_xgba_r18_emerald_flash.py
          python3 -m unittest discover -s tests -p 'test_xgba_r18_emerald_flash.py' -v 2>&1 | tee xgba-r18-native.log
          grep -q 'Ran 5 tests' xgba-r18-native.log
          grep -q '^OK$' xgba-r18-native.log
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          folder=Path("r18-evidence")
          shots=sorted(folder.glob("*.png"))
          assert len(shots)==3,shots
          for shot in shots:
              with Image.open(shot) as image:assert image.size==(240,160)
          proof=json.loads((folder/"proof.json").read_text())
          assert proof["real_original_flash_write"]
          assert proof["native_original_CB2_ContinueSavedGame"]
          assert proof["bad_external_pack_rejected_without_changing_saved_game"]
          assert not list(folder.glob("*.gba")) and not list(folder.glob("*.sav")) and not list(folder.glob("*.bin"))
          print("PASS_R18_REAL_EMERALD_FLASH_COLD_CONTINUE_5_TESTS")
          PY
      - name: Publish only genuine Emerald LCD and non-ROM proof JSON
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-r18-original-emerald-flash-cold-continue
          path: r18-evidence/
          retention-days: 90
          if-no-files-found: error
