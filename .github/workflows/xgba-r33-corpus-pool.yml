name: XGBA R33 source-aware multi-shard host resource pool
on:
  push:
    branches: [main, 'phase3/r33-multisource-sharded-pool-20261112']
    paths:
      - 'tools/xgba_corpus_pool.py'
      - 'tests/test_xgba_corpus_pool.py'
      - 'tools/xgba_whole_corpus.py'
      - 'tools/xgba_resource_sidecar.py'
      - '.github/workflows/xgba-r33-corpus-pool.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/xgba_corpus_pool.py'
      - 'tests/test_xgba_corpus_pool.py'
      - 'tools/xgba_whole_corpus.py'
      - 'tools/xgba_resource_sidecar.py'
      - '.github/workflows/xgba-r33-corpus-pool.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgba-r33-pool-${{ github.ref }}
  cancel-in-progress: true
jobs:
  three-source-host-pool:
    name: Three synthetic source worlds, every shard, 13 refusal/lifecycle cases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Source-aware R32-to-R33 complete sharded integration
        run: |
          set -euo pipefail
          python3 -m py_compile tools/xgba_corpus_pool.py tests/test_xgba_corpus_pool.py
          PYTHONPATH=tools:tests python3 -m unittest test_xgba_corpus_pool.MultiSourceShardedPool -v 2>&1 | tee /tmp/r33-pool.log
          grep -q 'Ran 13 tests' /tmp/r33-pool.log
          grep -q '^OK$' /tmp/r33-pool.log
          echo 'PASS_R33_THREE_SOURCE_WORLDS 13/13 no_map_renumbering=1 bounded_RAM=1'
  full-original-emerald-corpus:
    name: All original Emerald source files addressable across every actual R32 shard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get exact original Emerald pinned source
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/pret/pokeemerald.git upstream/pokeemerald
          git -C upstream/pokeemerald checkout --quiet --detach 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          test "$(git -C upstream/pokeemerald rev-parse HEAD)" = 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
      - name: Import all Emerald files, open all sidecars and verify at least one source per shard
        env:
          R33_ROOT: ${{ runner.temp }}/r33-pool
        run: |
          set -euo pipefail
          python3 tools/xgba_whole_corpus.py --source emerald=upstream/pokeemerald \
            --pack --output "$R33_ROOT"
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from xgba_corpus_pool import CorpusPool
          root=Path(os.environ['R33_ROOT'])
          doc=json.loads((root/'xgba-whole-corpus-index.json').read_text())
          p=CorpusPool(root/'xgba-whole-corpus-index.json')
          assert p.resource_count==doc['summary']['catalogued_files']>9000
          assert p.shard_count==len(doc['shards'])>20
          assert p.find_original_map('emerald',0,9)['name']=='LittlerootTown'
          assert p.find_original_map('emerald',0,16)['name']=='Route101'
          selected={}
          for entry in doc['source_reports'][0]['resources']:
              if entry['bytes']>0:selected.setdefault(entry['shard'],entry)
          assert len(selected)==p.shard_count
          original=Path('upstream/pokeemerald')
          for name,entry in selected.items():
              rid=p.find('emerald',entry['path'])
              assert rid==entry['resource_id']
              count=min(16,entry['bytes'])
              with (original/entry['path']).open('rb') as f:
                  expected=f.read(count)
              assert p.read_window(rid,0,count)==expected
          assert p.staged_bytes==0
          summary={'original_files':p.resource_count,'addressable_shards':p.shard_count,
                   'verified_shard_samples':len(selected),'source_worlds':len(p.source_ids),
                   'original_map_count':doc['summary']['original_map_count'],
                   'runtime_playable_cross_worlds':0,'raw_source_import_only':True}
          (Path(os.environ['RUNNER_TEMP'])/'r33-summary.json').write_text(
              json.dumps(summary,sort_keys=True,indent=2)+'\n')
          print('PASS_R33_REAL_EMERALD_ALL_SHARDS',json.dumps(summary,sort_keys=True))
          PY
      - name: Preserve aggregate-only evidence (never source assets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-r33-original-emerald-source-aware-pool-counts
          path: ${{ runner.temp }}/r33-summary.json
          retention-days: 90
          if-no-files-found: warn
