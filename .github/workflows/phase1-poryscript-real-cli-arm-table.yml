name: Phase 1 actual Poryscript CLI to GNU ARM map table
on:
  push:
    branches:
      - 'phase1/**'
    paths:
      - 'tools/verify_poryscript_actual_cli_arm_table.py'
      - 'tools/phase1_poryscript_reader_host.py'
      - 'tools/phase1_poryscript_dispatch_host.py'
      - 'tools/phase1_poryscript_original_agbcc_reader.py'
      - 'tests/phase1_poryscript_reader_host.c'
      - 'tests/phase1_poryscript_dispatch_host.c'
      - 'tools/phase1_poryscript_consumer_bounds.py'
      - '.github/workflows/phase1-poryscript-real-cli-arm-table.yml'
      - 'docs/PHASE1_P0_PORYSCRIPT_REAL_CLI_GNU_ARM_TABLE_2026-10-27.md'
  pull_request:
    paths:
      - 'tools/verify_poryscript_actual_cli_arm_table.py'
      - 'tools/phase1_poryscript_reader_host.py'
      - 'tools/phase1_poryscript_dispatch_host.py'
      - 'tools/phase1_poryscript_original_agbcc_reader.py'
      - 'tests/phase1_poryscript_reader_host.c'
      - 'tests/phase1_poryscript_dispatch_host.c'
      - '.github/workflows/phase1-poryscript-real-cli-arm-table.yml'
      - 'docs/PHASE1_P0_PORYSCRIPT_REAL_CLI_GNU_ARM_TABLE_2026-10-27.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:

  pinned-host-c-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: pinned-firered
          persist-credentials: false
      - name: Compile exact source-extracted FireRed C readers and execute bounded fixture
        run: |
          set -euo pipefail
          mkdir -p phase1-evidence
          python3 -m py_compile tools/phase1_poryscript_reader_host.py
          python3 tools/phase1_poryscript_reader_host.py \
            --firered pinned-firered \
            --test tests/phase1_poryscript_reader_host.c \
            --output phase1-evidence/poryscript-pinned-host-c-reader.json
          python3 -m json.tool phase1-evidence/poryscript-pinned-host-c-reader.json >/dev/null
      - name: Archive text-only source-extracted host C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-poryscript-host-c-reader-text
          path: phase1-evidence/poryscript-pinned-host-c-reader.json
          if-no-files-found: warn

  pinned-host-c-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: pinned-firered
          persist-credentials: false
      - name: Execute unchanged pinned map-script dispatch and 11 source mutations
        run: |
          set -euo pipefail
          mkdir -p phase1-evidence
          python3 -m py_compile tools/phase1_poryscript_dispatch_host.py
          python3 tools/phase1_poryscript_dispatch_host.py \
            --firered pinned-firered \
            --test tests/phase1_poryscript_dispatch_host.c \
            --output phase1-evidence/poryscript-pinned-dispatch-host.json
          python3 -m json.tool phase1-evidence/poryscript-pinned-dispatch-host.json >/dev/null
      - name: Archive text-only pinned dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-poryscript-host-c-dispatch-text
          path: phase1-evidence/poryscript-pinned-dispatch-host.json
          if-no-files-found: warn

  actual-poryscript-arm-table:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: huderlem/poryscript
          ref: c32481161c767b25a3425fa9f1f8729927ff3d55
          path: upstream-poryscript
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: upstream-firered
          persist-credentials: false
      - name: Install GNU ARM assembler and linker
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi
          arm-none-eabi-as --version | head -1
          go version
      - name: Execute actual pinned CLI and compile original emitted map table
        run: |
          set -euo pipefail
          mkdir -p phase1-evidence
          python3 -m py_compile tools/verify_poryscript_actual_cli_arm_table.py tools/phase1_poryscript_consumer_bounds.py
          python3 tools/verify_poryscript_actual_cli_arm_table.py \
            --poryscript upstream-poryscript \
            --firered upstream-firered \
            --output phase1-evidence/poryscript-real-cli-gnu-arm-table.json
          python3 -m json.tool phase1-evidence/poryscript-real-cli-gnu-arm-table.json >/dev/null
      - name: Archive exact-source and compiled evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-poryscript-real-cli-gnu-arm
          path: phase1-evidence/
          if-no-files-found: warn
          retention-days: 60

  original-agbcc-linked-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original compiler and GNU ARM binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev build-essential
      - name: Pin source-built FireRed and original agbcc
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/pret/pokefirered.git pinned-firered
          git -C pinned-firered checkout --quiet --detach ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          git clone --quiet --filter=blob:none https://github.com/pret/agbcc.git pinned-agbcc
          git -C pinned-agbcc checkout --quiet --detach da598c1d918402c42c0c0d7128ba14567f3175e9
          test "$(git -C pinned-firered rev-parse HEAD)" = ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          test "$(git -C pinned-agbcc rev-parse HEAD)" = da598c1d918402c42c0c0d7128ba14567f3175e9
          test "$(git -C pinned-firered hash-object src/script.c)" = d0433bdda062b138e53d1a1d3184b4566ad7d9dc
          (cd pinned-agbcc && ./build.sh && ./install.sh ../pinned-firered) > agbcc.log 2>&1 || { tail -100 agbcc.log; exit 1; }
          make -C pinned-firered -j2 GAME_VERSION=FIRERED MODERN=0 > firered.log 2>&1 || { tail -120 firered.log; exit 1; }
          test -s pinned-firered/pokefirered.elf
      - name: Verify actual original-agbcc linked reader functions and seven tamper controls
        run: |
          set -euo pipefail
          python3 -m py_compile tools/phase1_poryscript_original_agbcc_reader.py
          python3 tools/phase1_poryscript_original_agbcc_reader.py \
            --source pinned-firered \
            --elf pinned-firered/pokefirered.elf \
            --output phase1-evidence/poryscript-original-agbcc-readers.json
      - name: Archive text-only compiled reader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-poryscript-original-agbcc-reader-text
          path: phase1-evidence/poryscript-original-agbcc-readers.json
          if-no-files-found: warn
