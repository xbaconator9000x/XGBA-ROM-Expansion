name: Phase 1 third P0 original machine dossier byte reconciliation
on:
  push:
    branches:
      - phase1/review-readiness-handoff-20261027
  pull_request:
permissions:
  contents: read
jobs:
  third-machine-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rehash original 14834 dossiers and verify third packet 100 with 704 negatives
        run: python3 tools/phase1_third_machine_dossier_sha_verify.py
