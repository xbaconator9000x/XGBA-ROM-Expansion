name: Phase 1 original five Porymap Project JSON writers native Qt ENOSPC
on:
  push:
    branches:
      - phase1/porymap-full-qt-project-roundtrip-20261028
    paths:
      - 'tests/phase1_porymap_five_json_writers_native.cpp'
      - 'tools/phase1_porymap_five_json_writers_native.py'
      - 'docs/phase1-review-readiness/porymap-five-json-writers-native-20261029.md'
      - '.github/workflows/phase1-porymap-five-json-writers-native.yml'
  pull_request:
    paths:
      - 'tests/phase1_porymap_five_json_writers_native.cpp'
      - 'tools/phase1_porymap_five_json_writers_native.py'
      - 'docs/phase1-review-readiness/porymap-five-json-writers-native-20261029.md'
      - '.github/workflows/phase1-porymap-five-json-writers-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-five-project-json-native-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: huderlem/porymap
          ref: 26b919d7ff4b54152de010abd5bf344af2ebe116
          path: upstream-porymap
          persist-credentials: false
      - name: Install Qt and syscall tracer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qt6-base-dev strace pkg-config
      - name: Execute original five Project writer bodies with Qt
        run: |
          set -euo pipefail
          python3 -m py_compile tools/phase1_porymap_five_json_writers_native.py
          python3 tools/phase1_porymap_five_json_writers_native.py \
            --porymap upstream-porymap \
            --harness tests/phase1_porymap_five_json_writers_native.cpp \
            --output phase1-evidence/porymap-five-json-native.json \
            --log phase1-evidence/porymap-five-json-native.log \
            --trace phase1-evidence/porymap-five-json-native-strace.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-porymap-five-json-native
          path: phase1-evidence/
          if-no-files-found: warn
          retention-days: 90
