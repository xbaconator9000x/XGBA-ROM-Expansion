name: Phase 1 standalone Copilot receipt verifier v1
on:
  pull_request:
    paths:
      - 'tools/phase1_copilot_receipts_v1.py'
      - 'tests/test_phase1_copilot_receipts_v1.py'
      - 'tools/phase1_copilot_receipts_v4_adapter.py'
      - 'tests/test_phase1_copilot_receipts_v4_adapter.py'
      - 'tools/phase1_copilot_receipts_v5_adapter.py'
      - 'tests/test_phase1_copilot_receipts_v5_adapter.py'
      - 'tools/phase1_copilot_receipts_v6_adapter.py'
      - 'tests/test_phase1_copilot_receipts_v6_adapter.py'
      - 'docs/PHASE1_COPILOT_REVIEW_RECEIPTS_V1_PROPOSAL.md'
      - '.github/workflows/phase1-copilot-receipts-v1.yml'
  push:
    paths:
      - 'tools/phase1_copilot_receipts_v1.py'
      - 'tests/test_phase1_copilot_receipts_v1.py'
      - 'tools/phase1_copilot_receipts_v4_adapter.py'
      - 'tests/test_phase1_copilot_receipts_v4_adapter.py'
      - 'tools/phase1_copilot_receipts_v5_adapter.py'
      - 'tests/test_phase1_copilot_receipts_v5_adapter.py'
      - 'tools/phase1_copilot_receipts_v6_adapter.py'
      - 'tests/test_phase1_copilot_receipts_v6_adapter.py'
      - 'docs/PHASE1_COPILOT_REVIEW_RECEIPTS_V1_PROPOSAL.md'
      - '.github/workflows/phase1-copilot-receipts-v1.yml'
permissions:
  contents: read
jobs:
  synthetic-verifier-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: python3 -m py_compile tools/phase1_copilot_receipts_v1.py tests/test_phase1_copilot_receipts_v1.py
      - name: Run synthetic positive and fail-closed controls
        run: python3 -m unittest discover -s tests -p 'test_phase1_copilot_receipts_v1.py' -v
  v4-adapter-fail-closed-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check v4 adapter and test syntax
        run: python3 -m py_compile tools/phase1_copilot_receipts_v4_adapter.py tests/test_phase1_copilot_receipts_v4_adapter.py
      - name: Run v4 adapter synthetic positive and adversarial controls
        run: python3 -m unittest discover -s tests -p 'test_phase1_copilot_receipts_v4_adapter.py' -v
  v5-adapter-fail-closed-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check v5 adapter and test syntax
        run: python3 -m py_compile tools/phase1_copilot_receipts_v5_adapter.py tests/test_phase1_copilot_receipts_v5_adapter.py
      - name: Run v5 adapter synthetic positive and adversarial controls
        run: python3 -m unittest discover -s tests -p 'test_phase1_copilot_receipts_v5_adapter.py' -v
  v6-adapter-fail-closed-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check v6 adapter and test syntax
        run: python3 -m py_compile tools/phase1_copilot_receipts_v6_adapter.py tests/test_phase1_copilot_receipts_v6_adapter.py
      - name: Run v6 adapter synthetic positive and adversarial controls
        run: python3 -m unittest discover -s tests -p 'test_phase1_copilot_receipts_v6_adapter.py' -v
  v5-live-pinned-source-and-github-evidence:
    # Separate from synthetic controls: execute the actual v5 adapter against
    # original pinned source bytes, all 14,834 dossiers and live GitHub evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out existing PR2 adapter at this exact workflow head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out exact historical PR8 receipt and complete ancestry
        uses: actions/checkout@v4
        with:
          repository: xbaconator9000x/XGBA-ROM-Expansion
          ref: 3ee4b1117f2976b6ea41098f5456634da18a50f8
          fetch-depth: 0
          persist-credentials: false
          path: .phase1-live/pr8
      - name: Check out immutable original mGBA source
        uses: actions/checkout@v4
        with:
          repository: mgba-emu/mgba
          ref: fd9dc5c2cbf234365068855851107e762fc6211b
          persist-credentials: false
          path: .phase1-live/upstreams/mgba
      - name: Verify exact checkout identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .phase1-live/pr8 rev-parse HEAD)" = "3ee4b1117f2976b6ea41098f5456634da18a50f8"
          test "$(git -C .phase1-live/upstreams/mgba rev-parse HEAD)" = "fd9dc5c2cbf234365068855851107e762fc6211b"
          python3 -m py_compile tools/phase1_copilot_receipts_v5_adapter.py
      - name: Execute real four-receipt v5 validator (fail closed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/phase1_copilot_receipts_v5_adapter.py \
            --pr8-root "$GITHUB_WORKSPACE/.phase1-live/pr8" \
            --source-root "$GITHUB_WORKSPACE/.phase1-live/upstreams"
  v6-live-pinned-source-and-github-evidence:
    # Separate from synthetic controls: validate all seven records without
    # treating the fixtures, evidence workpaper, or transport commit as approvals.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out existing PR2 adapter at this exact workflow head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out exact seven-receipt PR8 commit and complete ancestry
        uses: actions/checkout@v4
        with:
          repository: xbaconator9000x/XGBA-ROM-Expansion
          ref: 4c7c09b6257d2e88a2e19bab524e9d7174d3023e
          fetch-depth: 0
          persist-credentials: false
          path: .phase1-live/pr8
      - name: Check out immutable original mGBA source
        uses: actions/checkout@v4
        with:
          repository: mgba-emu/mgba
          ref: fd9dc5c2cbf234365068855851107e762fc6211b
          persist-credentials: false
          path: .phase1-live/upstreams/mgba
      - name: Verify exact checkout identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .phase1-live/pr8 rev-parse HEAD)" = "4c7c09b6257d2e88a2e19bab524e9d7174d3023e"
          test "$(git -C .phase1-live/upstreams/mgba rev-parse HEAD)" = "fd9dc5c2cbf234365068855851107e762fc6211b"
          python3 -m py_compile tools/phase1_copilot_receipts_v6_adapter.py
      - name: Execute real seven-receipt v6 validator (fail closed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/phase1_copilot_receipts_v6_adapter.py \
            --pr8-root "$GITHUB_WORKSPACE/.phase1-live/pr8" \
            --source-root "$GITHUB_WORKSPACE/.phase1-live/upstreams"
