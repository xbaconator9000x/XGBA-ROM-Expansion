name: XGBA R24 original Emerald adversarial 16KiB resource boundary
on:
  push:
    branches:
      - main
      - 'phase3/r24-native-resource-boundary-20261112'
    paths:
      - 'tools/xgba_r16_emerald_decomp_patch.py'
      - 'integration/emerald/xgba_r24_boundary.inc'
      - 'integration/mgba/xgba_mgba_device.c'
      - 'integration/mgba/xgba_mgba_device.h'
      - 'integration/mgba/xgba_r24_boundary.h'
      - 'integration/mgba/xgba_mgba_headless.c'
      - 'tools/xgba_mgba_run.py'
      - 'tests/test_xgba_r24_emerald_boundary.py'
      - '.github/workflows/xgba-r24-native-boundary.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/xgba_r16_emerald_decomp_patch.py'
      - 'integration/emerald/**'
      - 'integration/mgba/xgba_r24_boundary.h'
      - 'integration/mgba/xgba_mgba_headless.c'
      - 'tools/xgba_mgba_run.py'
      - 'tests/test_xgba_r24_emerald_boundary.py'
      - '.github/workflows/xgba-r24-native-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgba-r24-native-original-emerald-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-original-emerald-mmio-adversarial-bounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned GNU ARM cross-compiler without Ubuntu package mirrors
        uses: carlosperate/arm-none-eabi-gcc-action@49f4db4520f840e77ab1e99b24cfac2c540a21b1
        with:
          release: '13.2.Rel1'
      - name: Check preinstalled native build requirements and install Pillow via Python packages
        shell: bash
        run: |
          set -euo pipefail
          arm-none-eabi-gcc --version
          arm-none-eabi-nm --version | head -n 1
          cmake --version | head -n 1
          cc --version | head -n 1
          if ! pkg-config --exists libpng; then
            echo "::error::Runner missing libpng development headers; cannot use apt mirror"
            exit 1
          fi
          if ! python3 -c 'from PIL import Image' >/dev/null 2>&1; then
            python3 -m pip install --user --break-system-packages --disable-pip-version-check 'Pillow==11.3.0'
          fi
          python3 -c 'from PIL import Image; print("Pillow:", Image.__version__)'
      - name: Retrieve immutable original Emerald decomp and existing mGBA core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          git clone --quiet --filter=blob:none https://github.com/pret/pokeemerald.git upstream/pokeemerald
          git -C upstream/pokeemerald checkout --quiet --detach 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          git clone --quiet --filter=blob:none https://github.com/mgba-emu/mgba.git upstream/mgba
          git -C upstream/mgba checkout --quiet --detach fd9dc5c2cbf234365068855851107e762fc6211b
          test "$(git -C upstream/pokeemerald rev-parse HEAD)" = 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          test "$(git -C upstream/mgba rev-parse HEAD)" = fd9dc5c2cbf234365068855851107e762fc6211b
      - name: Execute nine native original Emerald MMIO transactions and identical-ROM disabled baseline
        shell: bash
        env:
          XGBA_R24_EVIDENCE_DIR: ${{ github.workspace }}/r24-evidence
        run: |
          set -euo pipefail
          python3 -m py_compile tools/xgba_r16_emerald_decomp_patch.py tests/test_xgba_r24_emerald_boundary.py
          python3 -m unittest discover -s tests -p 'test_xgba_r24_emerald_boundary.py' -v 2>&1 | tee xgba-r24-tests.log
          grep -q 'Ran 14 tests' xgba-r24-tests.log
          grep -q '^OK$' xgba-r24-tests.log
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          folder=Path("r24-evidence")
          pngs=sorted(folder.glob("*.png"))
          assert len(pngs)==2,pngs
          for p in pngs:
              with Image.open(p) as im:assert im.size==(240,160)
          report=json.loads((folder/"proof.json").read_text())
          assert report["original_game_MMIO_attempts"]==9
          assert report["original_game_failed_requests"]==7
          assert report["minimum_guest_valid_capacity"]==16384
          assert report["rejected_guest_capacity"]==16385
          assert report["read_only_guest_MMIO_status_and_memory_verified"]
          assert "PASS_R24_ORIGINAL_EMERALD_BOUNDARY enabled=1" in report["native_enabled_output"]
          assert "PASS_R24_ORIGINAL_EMERALD_BOUNDARY enabled=0" in report["native_disabled_output"]
          assert not list(folder.glob("*.gba")) and not list(folder.glob("*.sav"))
          print("PASS_R24_REAL_EMERALD_RESOURCE_BOUNDARY_14_TESTS")
          PY
      - name: Publish only original native Emerald LCD captures and bounded proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgba-r24-original-emerald-16kb-fail-closed-boundary
          path: r24-evidence/
          retention-days: 90
          if-no-files-found: warn
