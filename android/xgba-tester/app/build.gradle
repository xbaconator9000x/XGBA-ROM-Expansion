plugins { id 'com.android.application' }

android {
    namespace 'org.xgba.tester'
    compileSdk 35

    defaultConfig {
        applicationId 'org.xgba.tester'
        minSdk 26
        targetSdk 35
        versionCode 43
        versionName '0.43.0-test'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '' }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    packaging {
        jniLibs { useLegacyPackaging true }
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
